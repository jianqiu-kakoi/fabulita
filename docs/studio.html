<title>fabulita studio</title>
<style>
  :root {
    --bg: #F6F4EE; --card: #FFFFFF; --ink: #2A2620; --muted: #6F695E;
    --accent: #2F5DA8; --accent-deep: #24497F; --accent-soft: rgba(47,93,168,0.09);
    --gold: #B8860B; --line: #E4DFD4; --underline: rgba(47,93,168,0.45);
    --ok: #3A7D44; --warn: #A65B1F; --danger: #A3352B;
    --pop-bg: #262A33; --pop-ink: #F2F0E9; --pop-muted: #A8B0BE;
    --serif: "Palatino", "Palatino Linotype", "Book Antiqua", Georgia, "Songti SC", "Hiragino Mincho ProN", serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1C21; --card: #22252C; --ink: #E7E3D9; --muted: #9A948A;
      --accent: #8AB0E8; --accent-deep: #A8C6F0; --accent-soft: rgba(138,176,232,0.12);
      --gold: #D5A54E; --line: #33363E; --underline: rgba(138,176,232,0.5);
      --ok: #7CBF87; --warn: #D99A5B; --danger: #E08A80;
      --pop-bg: #F2F0E9; --pop-ink: #262A33; --pop-muted: #5C6470;
    }
  }
  :root[data-theme="light"] {
    --bg: #F6F4EE; --card: #FFFFFF; --ink: #2A2620; --muted: #6F695E;
    --accent: #2F5DA8; --accent-deep: #24497F; --accent-soft: rgba(47,93,168,0.09);
    --gold: #B8860B; --line: #E4DFD4; --underline: rgba(47,93,168,0.45);
    --ok: #3A7D44; --warn: #A65B1F; --danger: #A3352B;
    --pop-bg: #262A33; --pop-ink: #F2F0E9; --pop-muted: #A8B0BE;
  }
  :root[data-theme="dark"] {
    --bg: #1A1C21; --card: #22252C; --ink: #E7E3D9; --muted: #9A948A;
    --accent: #8AB0E8; --accent-deep: #A8C6F0; --accent-soft: rgba(138,176,232,0.12);
    --gold: #D5A54E; --line: #33363E; --underline: rgba(138,176,232,0.5);
    --ok: #7CBF87; --warn: #D99A5B; --danger: #E08A80;
    --pop-bg: #F2F0E9; --pop-ink: #262A33; --pop-muted: #5C6470;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); margin: 0; padding: 2rem 1.25rem 5rem; line-height: 1.65; }
  .wrap { max-width: 46rem; margin: 0 auto; }
  .eyebrow { font-size: 0.75rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin: 0 0 0.4rem; }
  h1 { font-family: var(--serif); font-size: 1.8rem; font-weight: 600; margin: 0 0 0.3rem; }
  h2 { font-family: var(--serif); font-size: 1.15rem; font-weight: 600; margin: 0 0 0.8rem; }
  .muted { color: var(--muted); font-size: 0.88rem; }
  .mast-top { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.6rem; }
  .langsw { display: flex; gap: 0.35rem; }
  .langsw button, .btn, .btn-ghost {
    font-family: var(--sans); font-size: 0.82rem; padding: 0.35rem 0.8rem;
    border: 1px solid var(--line); border-radius: 100px; background: var(--card);
    color: var(--ink); cursor: pointer; transition: border-color 120ms ease, background-color 120ms ease;
  }
  .langsw button { font-size: 0.78rem; padding: 0.25rem 0.65rem; color: var(--muted); }
  .langsw button:hover, .btn:hover { border-color: var(--accent); }
  .langsw button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--card); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
  .btn-primary:hover { background: var(--accent-deep); }
  .btn-danger { color: var(--danger); }
  .btn-danger:hover { border-color: var(--danger); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.4rem 1.5rem; margin-bottom: 1.4rem; }
  .step-label { font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin: 0 0 0.6rem; }
  label { display: block; font-size: 0.82rem; color: var(--muted); margin: 0.7rem 0 0.2rem; }
  input[type=text], select, textarea {
    width: 100%; font-family: var(--sans); font-size: 0.95rem;
    padding: 0.5rem 0.7rem; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink);
  }
  textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82rem; min-height: 7rem; resize: vertical; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin-top: 0.9rem; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
  @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }

  .plist { display: grid; gap: 0.9rem; }
  .pcard { display: flex; justify-content: space-between; align-items: center; gap: 1rem; cursor: pointer; }
  .pcard:hover { border-color: var(--accent); }
  .pcard h2 { margin: 0; }
  .pcard .muted { margin-top: 0.1rem; }

  .cov-bar { height: 6px; background: var(--accent-soft); border-radius: 3px; margin: 0.6rem 0 0.8rem; overflow: hidden; }
  .cov-fill { height: 100%; background: var(--accent); border-radius: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.3rem; max-height: 11rem; overflow-y: auto; }
  .chip {
    font-family: var(--serif); font-size: 0.88rem; padding: 0.05rem 0.55rem;
    border: 1px dashed var(--underline); border-radius: 100px;
    background: transparent; color: var(--accent-deep); cursor: default;
  }
  .chip.cov { border-style: solid; border-color: var(--line); color: var(--muted); }

  .msg { border-radius: 8px; padding: 0.6rem 0.9rem; font-size: 0.86rem; margin-top: 0.8rem; }
  .msg.ok { background: var(--accent-soft); color: var(--ink); }
  .msg.warn { border: 1px solid var(--warn); color: var(--warn); }
  .msg.err { border: 1px solid var(--danger); color: var(--danger); }
  .msg ul { margin: 0.3rem 0 0; padding-left: 1.2rem; }

  .scard { border: 1px solid var(--line); border-radius: 8px; padding: 0.9rem 1rem; margin-top: 0.8rem; }
  .scard-head { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .scard-head .title { font-family: var(--serif); font-size: 1.05rem; font-weight: 600; }
  .badge { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 100px; padding: 0.05rem 0.5rem; }
  .badge.cand { color: var(--gold); border: 1px solid var(--gold); }
  .badge.acc { color: var(--ok); border: 1px solid var(--ok); }
  .scard-head .spacer { margin-left: auto; }
  .scard .btn, .scard .btn-ghost { font-size: 0.75rem; padding: 0.2rem 0.6rem; }

  .prev { border-top: 1px solid var(--line); margin-top: 0.8rem; padding-top: 0.8rem; }
  .prev .es { font-family: var(--serif); font-size: 1.15rem; line-height: 2; margin: 0 0 0.6rem; }
  .prev .trans { font-size: 0.85rem; color: var(--muted); margin: 0; }
  .w { cursor: pointer; border-bottom: 1px dashed var(--underline); padding-bottom: 1px; }
  .w:hover { background: var(--accent-soft); }
  .say {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.4rem; height: 1.4rem; margin: 0 0.3rem; padding: 0;
    border: 1px solid var(--line); border-radius: 50%; background: transparent;
    color: var(--accent); cursor: pointer; vertical-align: baseline; transform: translateY(0.15em);
  }
  .say:hover { background: var(--accent-soft); border-color: var(--accent); }
  .say svg { width: 0.75rem; height: 0.75rem; display: block; }

  .pop {
    position: absolute; z-index: 10; background: var(--pop-bg); color: var(--pop-ink);
    border-radius: 8px; padding: 0.55rem 0.8rem; max-width: 15rem;
    box-shadow: 0 6px 24px rgba(0,0,0,0.22); font-size: 0.88rem; line-height: 1.5; display: none;
  }
  .pop.show { display: block; }
  .pop .pw { font-family: var(--serif); font-weight: 600; display: block; }
  .pop .pn { display: block; color: var(--pop-muted); font-size: 0.78rem; margin-top: 0.15rem; }

  footer.colophon { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 2.5rem; }
  footer.colophon a { color: var(--muted); }
</style>

// ───────────────────────── csv ─────────────────────────
function parseCsvLine(line, delim) {
  var out = [], cur = "", inQ = false;
  for (var i = 0; i < line.length; i++) {
    var c = line[i];
    if (inQ) {
      if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += c;
    } else if (c === '"') inQ = true;
    else if (c === delim) { out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out;
}

function importVocab(p, text) {
  var delim = text.indexOf("\t") !== -1 ? "\t" : ",";
  var added = 0, updated = 0, bad = [];
  var known = {};
  p.vocab.forEach(function (v) { known[norm(v.w)] = v; });
  text.split(/\r?\n/).forEach(function (line, i) {
    line = line.trim();
    if (!line) return;
    var cells = parseCsvLine(line, delim).map(function (c) { return c.trim(); }).filter(Boolean);
    if (!cells.length) return;
    if (i === 0 && /^(word|palabra|词|単語)$/i.test(cells[0])) return;
    if (cells.length < 2) { bad.push(i + 1); return; }
    var e = { w: cells[0], gloss: cells[1] };
    if (cells[2]) e.note = cells[2];
    var k = norm(e.w);
    if (known[k]) {
      if (known[k].gloss !== e.gloss || known[k].note !== e.note) { known[k].gloss = e.gloss; if (e.note) known[k].note = e.note; updated++; }
    } else { p.vocab.push(e); known[k] = e; added++; }
  });
  return { added: added, updated: updated, total: p.vocab.length, bad: bad };
}

// ───────────────────────── coverage / prompt ─────────────────────────
function coverage(p) {
  var cov = {};
  p.stories.forEach(function (s) { (s.vocab_used || []).forEach(function (w) { cov[norm(w)] = true; }); });
  var covered = p.vocab.filter(function (v) { return cov[norm(v.w)]; });
  var uncovered = p.vocab.filter(function (v) { return !cov[norm(v.w)]; });
  return { covered: covered, uncovered: uncovered, set: cov };
}

var LANG_NAMES = { es: "Spanish", en: "English", ja: "Japanese", zh: "Chinese", fr: "French", de: "German", it: "Italian", pt: "Portuguese", ko: "Korean" };
var GLOSS_NAMES = { zh: "Chinese (中文)", en: "English", ja: "Japanese", es: "Spanish" };
var SCHEMA = { id: "kebab-case-slug", title: "Story title in the target language", title_note: "title translated", sentences: [{ text: "First sentence.", trans: "translation of the sentence" }], vocab_used: ["word1", "word2"], glossary: { "word-form-in-text": ["gloss", "optional note e.g. ← infinitive"] }, grammar: [["pattern", "short explanation"]] };

function buildPrompt(p) {
  var un = coverage(p).uncovered.slice(0, 20);
  if (!un.length) return null;
  var list = un.map(function (v) { return "- " + v.w + " — " + v.gloss + (v.note ? " (" + v.note + ")" : ""); }).join("\n");
  return "You are writing a graded-reader micro-story for a beginner (CEFR A1) learner of " + (LANG_NAMES[p.config.lang] || p.config.lang) + ".\n\n" +
    "Write ONE short story (5-8 short sentences, simple present tense, one scene,\nconcrete everyday situation). You MUST use at least " + Math.min(10, un.length) + " and at most " + Math.min(20, un.length) + "\nof these vocabulary words (their glosses are in " + (GLOSS_NAMES[p.config.gloss_lang] || p.config.gloss_lang) + "):\n\n" +
    list + "\n\nRules:\n- Only A1-level grammar and high-frequency function words besides the list above.\n- Natural, coherent story — not a word-salad that name-drops vocabulary.\n- Glosses and translations must be written in " + (GLOSS_NAMES[p.config.gloss_lang] || p.config.gloss_lang) + ".\n- \"glossary\" must cover EVERY word form that appears in the text and is not a proper\n  name — including inflected verb forms.\n- \"vocab_used\" lists exactly the words from the vocabulary list above that appear\n  in the story (dictionary form as given in the list).\n\nReturn ONLY a JSON object in this exact shape (no markdown fence, no commentary):\n\n" + JSON.stringify(SCHEMA, null, 2);
}

// ───────────────────────── validation (port of stories.py) ─────────────────────────
function validateStory(p, s) {
  var errors = [], warnings = [];
  ["id", "title", "sentences"].forEach(function (k) { if (!s[k] || (k === "sentences" && !s[k].length)) errors.push("missing field: " + k); });
  if (errors.length) return { errors: errors, warnings: warnings };
  if (!/^[a-z0-9][a-z0-9-]*$/.test(s.id)) errors.push("id '" + s.id + "': use lowercase letters, digits, hyphens");
  s.sentences.forEach(function (x, i) { if (typeof x !== "object" || !x.text) errors.push("sentence " + i + ": need an object with at least 'text'"); });
  if (errors.length) return { errors: errors, warnings: warnings };
  if (p.stories.some(function (x) { return x.id === s.id; })) errors.push(t("dupId") + ": " + s.id);

  var fulltext = norm(s.sentences.map(function (x) { return x.text; }).join(" "));
  var tokens = {};
  (fulltext.match(/\p{L}+/gu) || []).forEach(function (w) { tokens[w] = true; });
  var vocabSet = {};
  p.vocab.forEach(function (v) { vocabSet[norm(v.w)] = true; });
  (s.vocab_used || []).forEach(function (w) {
    var k = norm(w), hit = tokens[k];
    if (!hit && k.length >= 4) {
      var stem = k.slice(0, -1);
      hit = Object.keys(tokens).some(function (tk) { return tk.indexOf(stem) === 0; });
    }
    if (!hit) hit = fulltext.indexOf(k) !== -1;
    if (!hit) warnings.push("vocab_used '" + w + "' does not seem to appear in the text");
    if (p.vocab.length && !vocabSet[k]) warnings.push("vocab_used '" + w + "' is not in the vocabulary");
  });
  return { errors: errors, warnings: warnings };
}

// ───────────────────────── export ─────────────────────────
function download(name, content, type) {
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type: type || "application/octet-stream" }));
  a.download = name;
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
}

function readerTemplate() {
  var bytes = Uint8Array.from(atob(READER_TPL_B64), function (c) { return c.charCodeAt(0); });
  return new TextDecoder("utf-8").decode(bytes);
}

function exportPage(p) {
  var payload = {
    config: { name: p.config.name, lang: p.config.lang, gloss_lang: p.config.gloss_lang, ui_default: state.lang, review_id: p.id },
    ui: READER_UI.ui, uiLangs: READER_UI.uiLangs,
    vocab: p.vocab, glossary: p.glossary || {}, stories: p.stories, audio: {}
  };
  var html = readerTemplate()
    .replace("__TITLE__", p.config.name)
    .replace("/*__PAYLOAD__*/null", JSON.stringify(payload).replace(/<\//g, "<\\/"));
  download((p.config.name || "fabulita").replace(/\s+/g, "-") + ".html", html, "text/html;charset=utf-8");
}

function exportBundle(p) {
  var bundle = { fabulita_bundle: 1, config: p.config, vocab: p.vocab, glossary: p.glossary || {}, stories: p.stories, uploads: p.uploads || [] };
  download("bundle.json", JSON.stringify(bundle, null, 2), "application/json;charset=utf-8");
}

function restoreBundle(text) {
  var b = JSON.parse(text);
  if (!b.fabulita_bundle || !b.config) throw new Error("not a fabulita bundle");
  var id = "p" + Math.random().toString(36).slice(2, 9);
  var p = { id: id, config: b.config, vocab: b.vocab || [], glossary: b.glossary || {}, stories: b.stories || [], uploads: b.uploads || [] };
  saveProj(p);
  return p;
}

// ───────────────────────── speech (preview) ─────────────────────────
var synth = window.speechSynthesis;
function speak(text, lang) {
  if (!synth) return;
  synth.cancel();
  var u = new SpeechSynthesisUtterance(text.replace(/[«»]/g, ""));
  var voices = synth.getVoices().filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf(lang) === 0; });
  if (voices.length) u.voice = voices[0];
  u.lang = voices.length ? voices[0].lang : lang;
  u.rate = 0.92;
  synth.speak(u);
}

var pop = document.getElementById("pop");
function hidePop() { pop.classList.remove("show"); }
function showPop(el, entry) {
  document.getElementById("pop-w").textContent = el.textContent;
  document.getElementById("pop-g").textContent = entry[0];
  var n = document.getElementById("pop-n");
  n.textContent = entry[1] || "";
  n.style.display = entry[1] ? "block" : "none";
  pop.classList.add("show");
  var r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  var left = Math.max(8, Math.min(r.left + r.width / 2 - pw / 2, window.innerWidth - pw - 8));
  var below = r.bottom + 8 + ph < window.innerHeight;
  pop.style.top = (window.scrollY + (below ? r.bottom + 8 : r.top - ph - 8)) + "px";
  pop.style.left = (window.scrollX + left) + "px";
}

var SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>';

function glossMap(p, story) {
  var m = {};
  p.vocab.forEach(function (v) { m[norm(v.w)] = [v.gloss, v.note || ""]; });
  Object.keys(p.glossary || {}).forEach(function (k) { m[norm(k)] = p.glossary[k]; });
  Object.keys(story.glossary || {}).forEach(function (k) { m[norm(k)] = story.glossary[k]; });
  return m;
}

function sentenceHtml(p, story, text, sIdx, i) {
  var gm = glossMap(p, story);
  var cjk = p.config.lang === "ja" || p.config.lang === "zh";
  var out = "";
  if (cjk) {
    var maxLen = 1;
    Object.keys(gm).forEach(function (k) { maxLen = Math.max(maxLen, Math.min(k.length, 12)); });
    var j = 0;
    while (j < text.length) {
      var hit = null;
      for (var len = Math.min(maxLen, text.length - j); len >= 1; len--) {
        var key = norm(text.substr(j, len));
        if (gm[key]) { hit = { key: key, len: len }; break; }
      }
      if (hit) { out += '<span class="w" data-s="' + sIdx + '" data-key="' + esc(hit.key) + '">' + esc(text.substr(j, hit.len)) + "</span>"; j += hit.len; }
      else { out += esc(text[j]); j += 1; }
    }
  } else {
    var last = 0, m, re = /\p{L}+/gu;
    while ((m = re.exec(text)) !== null) {
      out += esc(text.slice(last, m.index));
      var k = norm(m[0]);
      out += gm[k] ? '<span class="w" data-s="' + sIdx + '" data-key="' + esc(k) + '">' + esc(m[0]) + "</span>" : esc(m[0]);
      last = m.index + m[0].length;
    }
    out += esc(text.slice(last));
  }
  return out + '<button class="say" data-s="' + sIdx + '" data-i="' + i + '" title="' + esc(t("readSentence")) + '" aria-label="' + esc(t("readSentence")) + '">' + SPK + "</button>";
}

      s.sentences.forEach(function (sent, j) {
        h += '<p class="es">' + sentenceHtml(p, s, sent.text, i, j) + "</p>";
        if (sent.trans) h += '<p class="trans">' + esc(sent.trans) + "</p>";
      });
      h += "</div>";
    }
    h += "</div>";
  });
  h += "</div>";

  // ── step 3: export ──
  h += '<div class="card"><p class="step-label">' + esc(t("step3")) + "</p>" +
    '<div class="row" style="margin-top:0"><button class="btn btn-primary" data-act="export-page">' + esc(t("exportPage")) + "</button></div>" +
    '<p class="muted">' + esc(t("exportNote")) + "</p>" +
    '<div class="row"><button class="btn" data-act="export-bundle">' + esc(t("exportBundle")) + "</button></div>" +
    '<p class="muted">' + esc(t("bundleNote")) + "</p>" +
    '<div class="row"><button class="btn btn-danger" data-act="del-project">' + esc(t("deleteProject")) + "</button></div></div>";

  return h;
}

function render() {
  hidePop();
  document.getElementById("app").innerHTML = state.view === "home" ? homeView() : workView();
}

// ───────────────────────── events ─────────────────────────
document.addEventListener("change", function (e) {
  if (e.target.id === "vocab-file") {
    var f = e.target.files[0];
    if (!f) return;
    f.text().then(function (txt) { doImport(txt); });
  }
  if (e.target.id === "bundle-file") {
    var b = e.target.files[0];
    if (!b) return;
    b.text().then(function (txt) {
      try {
        var p = restoreBundle(txt);
        state.view = "work"; state.pid = p.id; state.msg = { where: "vocab", cls: "ok", html: esc(t("restored")) };
        render();
      } catch (err) { alert(t("invalidJson") + err.message); }
    });
  }
});

function doImport(text) {
  var p = proj();
  var r = importVocab(p, text);
  saveProj(p);
  var html = esc(fmt(t("importedMsg"), { a: r.added, u: r.updated, n: r.total }));
  if (r.bad.length) html += "<br>⚠ lines skipped (need ≥2 columns): " + r.bad.join(", ");
  state.msg = { where: "vocab", cls: r.bad.length ? "warn" : "ok", html: html };
  render();
}

document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]");
  if (!el) {
    var w = e.target.closest(".w");
    if (w) {
      var p0 = proj();
      if (p0) {
        var story = p0.stories[+w.dataset.s];
        var entry = glossMap(p0, story)[w.dataset.key];
        if (entry) { showPop(w, entry); e.stopPropagation(); return; }
      }
    }
    var say = e.target.closest(".say");
    if (say) {
      var p1 = proj(), st = p1.stories[+say.dataset.s];
      speak(st.sentences[+say.dataset.i].text, p1.config.lang);
      return;
    }
    if (!e.target.closest(".pop")) hidePop();
    return;
  }
  var act = el.dataset.act, p = proj();
  if (act === "lang") { state.lang = el.dataset.lang; try { localStorage.setItem(LSL, state.lang); } catch (err) {} render(); }
  else if (act === "open") { state.view = "work"; state.pid = el.dataset.id; state.msg = null; state.openPreview = null; render(); }
  else if (act === "back") { e.preventDefault(); state.view = "home"; state.msg = null; render(); }
  else if (act === "create") {
    var name = document.getElementById("np-name").value.trim() || "fabulita";
    var id = "p" + Math.random().toString(36).slice(2, 9);
    saveProj({ id: id, config: { name: name, lang: document.getElementById("np-lang").value, gloss_lang: document.getElementById("np-gloss").value, ui_default: state.lang }, vocab: [], glossary: {}, stories: [] });
    state.view = "work"; state.pid = id; state.msg = null; render();
  }
  else if (act === "import") { doImport(document.getElementById("vocab-paste").value); }
  else if (act === "copy-prompt") {
    var prompt = buildPrompt(p);
    if (!prompt) return;
    (navigator.clipboard ? navigator.clipboard.writeText(prompt) : Promise.reject()).then(function () {
      state.msg = { where: "prompt", cls: "ok", html: esc(t("copied")) }; render();
    }, function () {
      state.msg = { where: "prompt", cls: "ok", html: "<textarea readonly style='min-height:10rem'>" + esc(prompt) + "</textarea>" }; render();
    });
  }
  else if (act === "add-story") {
    var raw = document.getElementById("story-paste").value.trim().replace(/^```(json)?|```$/g, "");
    var s;
    try { s = JSON.parse(raw); } catch (err) { state.msg = { where: "story", cls: "err", html: esc(t("invalidJson") + err.message) }; render(); return; }
    s.status = "candidate"; s.vocab_used = s.vocab_used || []; s.glossary = s.glossary || {}; s.grammar = s.grammar || [];
    var v = validateStory(p, s);
    if (v.errors.length) { state.msg = { where: "story", cls: "err", html: esc(t("errPrefix")) + "<ul><li>" + v.errors.map(esc).join("</li><li>") + "</li></ul>" }; render(); return; }
    p.stories.push(s); saveProj(p);
    state.msg = { where: "story", cls: v.warnings.length ? "warn" : "ok", html: v.warnings.length ? esc(t("warnPrefix")) + "<ul><li>" + v.warnings.map(esc).join("</li><li>") + "</li></ul>" : esc(t("addedMsg") + s.title) };
    render();
  }
  else if (act === "accept") { p.stories[+el.dataset.i].status = "accepted"; saveProj(p); render(); }
  else if (act === "demote") { p.stories[+el.dataset.i].status = "candidate"; saveProj(p); render(); }
  else if (act === "remove") { p.stories.splice(+el.dataset.i, 1); saveProj(p); state.openPreview = null; render(); }
  else if (act === "toggle-prev") { state.openPreview = state.openPreview === +el.dataset.i ? null : +el.dataset.i; render(); }
  else if (act === "export-page") { exportPage(p); }
  else if (act === "export-bundle") { exportBundle(p); }
  else if (act === "del-project") {
    if (confirm(t("confirmDelete"))) {
      var all = loadAll(); delete all[state.pid]; saveAll(all);
      state.view = "home"; render();
    }
  }
});

window.addEventListener("scroll", hidePop, { passive: true });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") hidePop(); });

// deep link from the landing page: studio.html#p=<project-id>
var hashMatch = location.hash.match(/^#p=([a-z0-9]+)$/i);
if (hashMatch && loadAll()[hashMatch[1]]) {
  state.view = "work";
  state.pid = hashMatch[1];
}

render();
})();
</script>
