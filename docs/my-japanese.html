<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Japanese</title>
<style>
  :root {
    --bg: #F6F4EE;
    --card: #FFFFFF;
    --ink: #2A2620;
    --muted: #6F695E;
    --accent: #2F5DA8;
    --accent-deep: #24497F;
    --accent-soft: rgba(47, 93, 168, 0.09);
    --gold: #B8860B;
    --line: #E4DFD4;
    --underline: rgba(47, 93, 168, 0.45);
    --pop-bg: #262A33;
    --pop-ink: #F2F0E9;
    --pop-muted: #A8B0BE;
    --serif: "Palatino", "Palatino Linotype", "Book Antiqua", Georgia, "Songti SC", "Hiragino Mincho ProN", serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1C21; --card: #22252C; --ink: #E7E3D9; --muted: #9A948A;
      --accent: #8AB0E8; --accent-deep: #A8C6F0; --accent-soft: rgba(138, 176, 232, 0.12);
      --gold: #D5A54E; --line: #33363E; --underline: rgba(138, 176, 232, 0.5);
      --pop-bg: #F2F0E9; --pop-ink: #262A33; --pop-muted: #5C6470;
    }
  }
  :root[data-theme="light"] {
    --bg: #F6F4EE; --card: #FFFFFF; --ink: #2A2620; --muted: #6F695E;
    --accent: #2F5DA8; --accent-deep: #24497F; --accent-soft: rgba(47, 93, 168, 0.09);
    --gold: #B8860B; --line: #E4DFD4; --underline: rgba(47, 93, 168, 0.45);
    --pop-bg: #262A33; --pop-ink: #F2F0E9; --pop-muted: #A8B0BE;
  }
  :root[data-theme="dark"] {
    --bg: #1A1C21; --card: #22252C; --ink: #E7E3D9; --muted: #9A948A;
    --accent: #8AB0E8; --accent-deep: #A8C6F0; --accent-soft: rgba(138, 176, 232, 0.12);
    --gold: #D5A54E; --line: #33363E; --underline: rgba(138, 176, 232, 0.5);
    --pop-bg: #F2F0E9; --pop-ink: #262A33; --pop-muted: #5C6470;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); margin: 0;
    padding: 2.5rem 1.25rem 5rem; line-height: 1.7;
  }
  .wrap { max-width: 42rem; margin: 0 auto; }

  .masthead { margin-bottom: 2rem; }
  .mast-top { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .eyebrow {
    font-size: 0.75rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--gold); font-weight: 600; margin: 0 0 0.5rem;
  }
  .homelink { margin: 0 0 0.6rem; font-size: 0.82rem; }
  .homelink a { color: var(--muted); text-decoration: none; border: 1px solid var(--line); border-radius: 100px; padding: 0.2rem 0.75rem; }
  .homelink a:hover { color: var(--accent-deep); border-color: var(--accent); }
  h1 { font-family: var(--serif); font-size: 2rem; font-weight: 600; margin: 0 0 0.5rem; text-wrap: balance; }
  .hint { color: var(--muted); font-size: 0.9rem; margin: 0; }
  .hint .demo { border-bottom: 1px dashed var(--underline); color: var(--accent-deep); padding-bottom: 1px; }

  .langsw { display: flex; gap: 0.35rem; }
  .langsw button {
    font-family: var(--sans); font-size: 0.78rem; padding: 0.25rem 0.65rem;
    border: 1px solid var(--line); border-radius: 100px;
    background: var(--card); color: var(--muted); cursor: pointer;
  }
  .langsw button:hover { border-color: var(--accent); color: var(--accent-deep); }
  .langsw button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--card); }

  .controls { display: flex; align-items: center; gap: 0.6rem; margin-top: 1rem; flex-wrap: wrap; }
  .ctl {
    font-family: var(--sans); font-size: 0.82rem; padding: 0.35rem 0.8rem;
    border: 1px solid var(--line); border-radius: 100px;
    background: var(--card); color: var(--ink); cursor: pointer;
    transition: border-color 120ms ease, background-color 120ms ease;
  }
  .ctl:hover { border-color: var(--accent); }
  .ctl[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--card); }
  .ctl-note { font-size: 0.78rem; color: var(--muted); }

  .mode-tabs {
    display: inline-flex; gap: 0.3rem; padding: 0.25rem; margin-top: 1.15rem;
    border: 1px solid var(--line); border-radius: 100px; background: var(--card);
  }
  .mode-tab {
    display: inline-flex; align-items: center; gap: 0.45rem;
    font-family: var(--sans); font-size: 0.84rem; font-weight: 600;
    padding: 0.38rem 0.9rem; border: 0; border-radius: 100px;
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .mode-tab:hover { color: var(--accent-deep); }
  .mode-tab[aria-pressed="true"] { background: var(--accent); color: var(--card); }
  .mode-count {
    min-width: 1.25rem; padding: 0 0.35rem; border-radius: 100px;
    background: var(--accent-soft); color: var(--accent-deep);
    font-size: 0.7rem; line-height: 1.45; font-variant-numeric: tabular-nums;
  }
  .mode-tab[aria-pressed="true"] .mode-count { background: rgba(255,255,255,0.2); color: inherit; }

  .review-overview {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.65rem;
    margin-bottom: 1rem;
  }
  .review-stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 0.75rem 0.9rem;
  }
  .review-stat strong {
    display: block; color: var(--accent-deep); font-family: var(--serif);
    font-size: 1.4rem; line-height: 1.2; font-variant-numeric: tabular-nums;
  }
  .review-stat span { color: var(--muted); font-size: 0.75rem; }
  .review-progress { grid-column: span 1; }
  .review-progress .cov-bar { margin: 0.45rem 0 0; }

  .review-panel {
    min-height: 23rem; display: flex; flex-direction: column; justify-content: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 2rem; text-align: center;
  }
  .review-kicker {
    margin: 0 0 0.65rem; color: var(--gold); font-size: 0.72rem;
    font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
  }
  .review-word {
    margin: 0; color: var(--ink); font-family: var(--serif);
    font-size: clamp(2.4rem, 9vw, 4.2rem); font-weight: 600; line-height: 1.15;
    overflow-wrap: anywhere;
  }
  .review-word-say { margin-top: 0.8rem; align-self: center; }
  .review-answer {
    margin: 1.35rem auto 0; padding-top: 1.2rem; width: min(100%, 28rem);
    border-top: 1px solid var(--line);
  }
  .review-gloss { margin: 0; color: var(--accent-deep); font-size: 1.25rem; font-weight: 600; }
  .review-note { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.86rem; }
  .review-answer-form { width: min(100%, 28rem); margin: 1.35rem auto 0; text-align: left; }
  .review-answer-label { display: block; margin-bottom: 0.45rem; font-size: 0.78rem; font-weight: 700; }
  .review-answer-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.55rem; }
  .review-answer-input {
    min-width: 0; height: 2.75rem; padding: 0 0.85rem; border: 1px solid var(--line);
    border-radius: 9px; background: var(--card); color: var(--ink); font: 0.9rem var(--sans); outline: none;
  }
  .review-answer-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .review-answer-input[aria-invalid="true"] { border-color: #b54b3b; }
  .review-answer-check {
    min-height: 2.75rem; padding: 0 1rem; border: 1px solid var(--accent); border-radius: 9px;
    background: var(--accent); color: var(--card); font: 700 0.82rem var(--sans); cursor: pointer;
  }
  .review-answer-check:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
  .review-answer-hint { margin: 0.42rem 0 0; color: var(--muted); font-size: 0.7rem; }
  .review-skip { margin-top: 0.8rem; }
  .review-score {
    width: min(100%, 28rem); margin: 0 auto 1rem; padding: 0.72rem 0.85rem; border: 1px solid;
    border-radius: 9px; text-align: left; font-size: 0.78rem;
  }
  .review-score strong { display: block; margin-bottom: 0.18rem; }
  .review-score span { opacity: 0.8; overflow-wrap: anywhere; }
  .review-score.is-correct { background: #edf6eb; border-color: #c9dec7; color: #315f3c; }
  .review-score.is-incorrect { background: #fff0ec; border-color: #efc7bd; color: #9e3f2f; }
  .review-example {
    margin-top: 1.15rem; padding: 0.9rem 1rem; border-radius: 8px;
    background: var(--accent-soft); text-align: left;
  }
  .review-example-label {
    display: block; margin-bottom: 0.25rem; color: var(--gold);
    font-size: 0.68rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .review-example-text { margin: 0; font-family: var(--serif); font-size: 1.04rem; line-height: 1.8; }
  .review-example-trans { margin: 0.3rem 0 0; color: var(--muted); font-size: 0.82rem; }
  .review-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 1.3rem; }
  .review-action {
    font-family: var(--sans); padding: 0.7rem 0.8rem; border: 1px solid var(--line);
    border-radius: 9px; background: var(--card); color: var(--ink); cursor: pointer;
  }
  .review-action:hover { border-color: var(--accent); }
  .review-action:disabled { opacity: 0.62; cursor: default; }
  .review-action.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
  .review-action strong { display: block; font-size: 0.88rem; }
  .review-action small { display: block; margin-top: 0.1rem; opacity: 0.72; font-size: 0.7rem; }
  .review-issue-notice {
    margin: 0.75rem 0 0; color: var(--muted); font-size: 0.72rem; line-height: 1.5; text-align: center;
  }
  .review-issue-notice.is-error { color: #9e3f2f; }
  .review-reveal { margin-top: 1.6rem; padding-inline: 1.25rem; }
  .review-empty h2 { margin: 0; font-family: var(--serif); font-size: 1.55rem; }
  .review-empty p { margin: 0.5rem auto 1.2rem; max-width: 27rem; color: var(--muted); }

  /* Vocabulary-first learning dashboard. Kept fully scoped so the reader stays book-like. */
  body.vocab-dashboard-body {
    min-height: 100vh; padding: 0; background: #f7f3ea; color: #17202a; line-height: 1.5;
  }
  .wrap.vocab-dashboard-wrap { width: 100%; max-width: none; margin: 0; }
  .vocab-dashboard {
    --v-bg: #f7f3ea; --v-card: #fffdfa; --v-ink: #17202a; --v-muted: #706d67;
    --v-line: #e4ddd1; --v-accent: #e65f43; --v-accent-deep: #bd452f;
    --v-accent-soft: #fff0ea; --v-mint: #e6f1e7; --v-mint-ink: #3e7b50;
    --v-gold: #f6e8b8; --v-gold-ink: #8a6811; --v-blue: #eaf2fc; --v-blue-ink: #4276ae;
    min-height: 100vh; display: grid; grid-template-columns: 14.25rem minmax(0, 1fr);
    background: var(--v-bg); color: var(--v-ink);
  }
  .vocab-sidebar {
    position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
    padding: 2.1rem 1.25rem 1.25rem; border-right: 1px solid var(--v-line);
    background: rgba(255, 253, 250, 0.7);
  }
  .vocab-brand {
    margin: 0 0 2.65rem; padding: 0 0.55rem; color: var(--v-accent);
    font-size: 1.45rem; font-weight: 800; letter-spacing: -0.025em;
  }
  .vocab-nav { display: grid; gap: 0.55rem; }
  .vocab-nav button {
    width: 100%; display: flex; align-items: center; gap: 0.8rem; padding: 0.78rem 0.75rem;
    border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--v-ink);
    font: 650 0.9rem/1.2 var(--sans); text-align: left; cursor: pointer;
  }
  .vocab-nav button:hover { background: rgba(255,255,255,0.72); border-color: var(--v-line); }
  .vocab-nav button.is-active { background: #fff8e8; border-color: #efdfb9; }
  .vocab-nav-mark {
    width: 1.55rem; height: 1.55rem; display: inline-flex; align-items: center; justify-content: center;
    color: var(--v-accent); font-size: 1.05rem; flex: 0 0 auto;
  }
  .vocab-nav-count {
    margin-left: auto; min-width: 1.4rem; padding: 0.05rem 0.4rem; border-radius: 99px;
    background: var(--v-accent); color: white; font-size: 0.7rem; text-align: center;
  }
  .vocab-local-note {
    margin-top: auto; padding: 1rem 0.55rem 0; border-top: 1px solid var(--v-line);
    color: var(--v-muted); font-size: 0.72rem; line-height: 1.55;
  }
  .qa-main { min-width: 0; padding: 2.15rem clamp(1.2rem, 3vw, 3.25rem) 3rem; }
  .qa-topbar { margin-bottom: 1.65rem; }
  .qa-title { margin: 0; font: 800 clamp(1.85rem, 3vw, 2.5rem)/1.1 var(--sans); letter-spacing: -0.045em; }
  .qa-subtitle { margin: 0.5rem 0 0; color: var(--v-muted); font-size: 0.84rem; }
  .qa-shell {
    display: grid; grid-template-columns: minmax(18rem, 0.72fr) minmax(24rem, 1.28fr);
    gap: 1.25rem; align-items: start;
  }
  .qa-compose, .qa-list-panel {
    border: 1px solid var(--v-line); border-radius: 13px; background: rgba(255,255,255,0.75);
    box-shadow: 0 4px 18px rgba(75, 54, 28, 0.035);
  }
  .qa-compose { position: sticky; top: 1rem; padding: 1.4rem; }
  .qa-compose-kicker {
    margin: 0 0 0.45rem; color: var(--v-accent); font-size: 0.72rem; font-weight: 750;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .qa-compose h2 { margin: 0; font-size: 1.15rem; }
  .qa-compose-copy { margin: 0.55rem 0 1.15rem; color: var(--v-muted); font-size: 0.78rem; line-height: 1.65; }
  .qa-label { display: block; margin-bottom: 0.45rem; font-size: 0.78rem; font-weight: 750; }
  .qa-textarea {
    width: 100%; min-height: 10.5rem; resize: vertical; padding: 0.85rem 0.9rem;
    border: 1px solid #d6d0c7; border-radius: 9px; background: rgba(255,255,255,0.8);
    color: var(--v-ink); font: 0.88rem/1.65 var(--sans); outline: none;
  }
  .qa-textarea:focus { border-color: var(--v-accent); box-shadow: 0 0 0 3px rgba(230,95,67,0.12); }
  .qa-textarea[aria-invalid="true"] { border-color: #b54b3b; }
  .qa-form-foot { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-top: 0.7rem; }
  .qa-shortcut { color: var(--v-muted); font-size: 0.68rem; }
  .qa-save {
    min-height: 2.6rem; padding: 0 1rem; border: 1px solid var(--v-accent); border-radius: 9px;
    background: var(--v-accent); color: #fff; font: 750 0.82rem var(--sans); cursor: pointer;
  }
  .qa-save:hover { background: var(--v-accent-deep); border-color: var(--v-accent-deep); }
  .qa-notice { min-height: 1.2rem; margin: 0.65rem 0 0; color: var(--v-mint-ink); font-size: 0.72rem; }
  .qa-list-panel { min-width: 0; overflow: hidden; }
  .qa-list-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
    padding: 1.25rem 1.35rem; border-bottom: 1px solid var(--v-line);
  }
  .qa-list-head h2 { margin: 0; font-size: 1.05rem; }
  .qa-list-count { color: var(--v-muted); font-size: 0.76rem; }
  .qa-list { display: grid; margin: 0; padding: 0; list-style: none; }
  .qa-item { padding: 1.15rem 1.35rem; border-bottom: 1px solid var(--v-line); }
  .qa-item:last-child { border-bottom: 0; }
  .qa-item-head { display: flex; align-items: center; gap: 0.65rem; }
  .qa-item-number {
    display: inline-flex; align-items: center; justify-content: center; min-width: 1.7rem; height: 1.7rem;
    padding: 0 0.35rem; border-radius: 99px; background: var(--v-accent-soft); color: var(--v-accent-deep);
    font-size: 0.7rem; font-weight: 800;
  }
  .qa-item-time { color: var(--v-muted); font-size: 0.7rem; }
  .qa-item-source {
    padding: 0.22rem 0.48rem; border-radius: 99px; background: var(--v-blue); color: var(--v-blue-ink);
    font-size: 0.66rem; font-weight: 750;
  }
  .qa-delete {
    margin-left: auto; padding: 0.28rem 0.55rem; border: 1px solid transparent; border-radius: 7px;
    background: transparent; color: var(--v-muted); font: 0.7rem var(--sans); cursor: pointer;
  }
  .qa-delete:hover { border-color: #efc7bd; background: #fff0ec; color: #9e3f2f; }
  .qa-item-text { margin: 0.8rem 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.9rem; line-height: 1.7; }
  .qa-delete-confirm {
    display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; margin-top: 0.85rem;
    padding-top: 0.8rem; border-top: 1px solid var(--v-line); color: #9e3f2f; font-size: 0.72rem;
  }
  .qa-delete-confirm span { margin-right: auto; }
  .qa-delete-cancel, .qa-delete-do {
    min-height: 2.2rem; padding: 0 0.72rem; border: 1px solid var(--v-line); border-radius: 7px;
    background: #fff; color: var(--v-ink); font: 0.72rem var(--sans); cursor: pointer;
  }
  .qa-delete-do { border-color: #efc7bd; background: #fff0ec; color: #9e3f2f; font-weight: 750; }
  .qa-empty { padding: 4.5rem 1.5rem; text-align: center; color: var(--v-muted); }
  .qa-empty-mark {
    display: inline-flex; align-items: center; justify-content: center; width: 3rem; height: 3rem;
    margin-bottom: 0.8rem; border: 1px solid #efdfb9; border-radius: 50%; background: #fff8e8;
    color: var(--v-accent); font-size: 1.45rem; font-weight: 800;
  }
  .qa-empty h3 { margin: 0; color: var(--v-ink); font-size: 1rem; }
  .qa-empty p { margin: 0.45rem 0 0; font-size: 0.76rem; }
  .qa-privacy { margin: 1rem 0 0; color: var(--v-muted); font-size: 0.7rem; line-height: 1.55; }
  .homework-main { min-width: 0; padding: 2.15rem clamp(1.2rem, 3vw, 3.25rem) 3rem; }
  .homework-topbar {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 1.5rem; margin-bottom: 1.4rem;
  }
  .homework-title { margin: 0; font: 800 clamp(1.85rem, 3vw, 2.5rem)/1.1 var(--sans); letter-spacing: -0.045em; }
  .homework-subtitle { margin: 0.5rem 0 0; color: var(--v-muted); font-size: 0.84rem; }
  .homework-list { display: grid; gap: 1rem; }
  .homework-card, .homework-sheet, .homework-summary {
    border: 1px solid var(--v-line); border-radius: 13px; background: rgba(255,255,255,0.76);
    box-shadow: 0 4px 18px rgba(75,54,28,0.035);
  }
  .homework-card {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 1.25rem;
    padding: 1.35rem;
  }
  .homework-card-kicker {
    display: flex; align-items: center; gap: 0.55rem; margin: 0 0 0.55rem;
    color: var(--v-muted); font-size: 0.68rem; font-weight: 750;
  }
  .homework-badge {
    display: inline-flex; align-items: center; min-height: 1.7rem; padding: 0.18rem 0.58rem;
    border: 1px solid #efc2b7; border-radius: 99px; background: var(--v-accent-soft);
    color: var(--v-accent-deep); font-size: 0.68rem; font-weight: 850; letter-spacing: 0.03em;
  }
  .homework-license-badge {
    display: inline-flex; align-items: center; min-height: 1.55rem; padding: 0.12rem 0.5rem;
    border: 1px solid #c7ddce; border-radius: 99px; background: #edf7f0;
    color: #356448; font-size: 0.62rem; font-weight: 850;
  }
  .homework-card h2 { margin: 0; font-size: 1.12rem; overflow-wrap: anywhere; }
  .homework-card-meta { margin: 0.5rem 0 0; color: var(--v-muted); font-size: 0.74rem; }
  .homework-card-progress {
    display: flex; align-items: center; gap: 0.6rem; margin-top: 0.85rem; color: var(--v-muted); font-size: 0.7rem;
  }
  button.homework-card-progress {
    width: 100%; padding: 0; border: 0; background: transparent; font-family: var(--sans); text-align: left; cursor: pointer;
  }
  button.homework-card-progress:hover .homework-card-progress-label { color: var(--v-accent-deep); }
  .homework-card-progress-label { min-width: 3.25rem; color: var(--v-ink); font-weight: 800; }
  .homework-card-progress-bar {
    width: min(15rem, 55%); height: 0.45rem; overflow: hidden; border-radius: 99px; background: #ebe8e3;
  }
  .homework-card-progress-bar span, .homework-progress-bar span {
    display: block; height: 100%; border-radius: inherit; background: var(--v-accent);
  }
  .homework-card-actions { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; justify-content: flex-end; }

  function homeworkAnalysisPrompt(assignment, entry, attempts) {
    var lines = [
      "你是一位面向中文学习者的" + targetLanguageLabel() + "老师。请分析学生在下面这道题的历次作答。",
      "",
      "【题目】" + (entry.section.title ? entry.section.title + " — " : "") + entry.item.prompt,
      entry.section.instructions ? "【本节要求】" + entry.section.instructions : "",
      "【标准答案】" + homeworkExpectedAnswer(entry.item),
      "",
      "【历次作答（按时间顺序）】"
    ];
    attempts.forEach(function (attempt, index) {
      lines.push((index + 1) + ". " + (attempt.label ? attempt.label + "：" : "") +
        (attempt.answer || "（空）") + " → " + (HOMEWORK_VERDICT_LABELS[attempt.verdict] || attempt.verdict));
    });
    lines.push("",
      "请用中文简洁输出：",
      "1) 每次错误分别错在哪里（逐条对应，指出具体差在哪个假名或形态）；",
      "2) 涉及的语法规则，讲清楚为什么是这个变形；",
      "3) 一句话记忆要点；",
      "4) 出 2 道针对同类错误的小练习并附答案。",

  function requestHomeworkAnalysis(assignment) {
    var active = homeworkActiveItems(assignment);
    var entry = active[state.homeworkIndex];
    if (!entry || state.homeworkAnalysisPendingId) return;
    var attempts = homeworkAttemptHistory(assignment, entry.item);
    if (!attempts.length) {
      state.homeworkAnalysisNotice = "这道题还没有作答记录，先答一次再分析。";
      render();
      return;
    }
    var config = homeworkAiConfig();
    var headers = { "content-type": "application/json" };
    if (config.key) headers.Authorization = "Bearer " + config.key;
    var controller = typeof AbortController === "function" ? new AbortController() : null;
    var timer = controller ? setTimeout(function () { controller.abort(); }, 180000) : null;
    state.homeworkAnalysisPendingId = entry.item.id;
    state.homeworkAnalysisNotice = "";
    render();
    fetch(config.base + "/chat/completions", {
      method: "POST",
      headers: headers,
      signal: controller ? controller.signal : undefined,
      body: JSON.stringify({
        model: config.model,
        stream: false,
        messages: [{ role: "user", content: homeworkAnalysisPrompt(assignment, entry, attempts) }]
      })
    }).then(function (res) {
      if (timer) clearTimeout(timer);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }).then(function (data) {
      var message = data && data.choices && data.choices[0] && data.choices[0].message;
      var text = message && typeof message.content === "string" ? message.content.trim() : "";
      if (!text) throw new Error("空回复");
      saveHomeworkAnalysis(assignment, entry.item, {
        text: text.slice(0, 6000),
        occurredAt: Date.now(),
        model: (data && data.model) || config.model || "",
        attemptCount: attempts.length
      });
      state.homeworkAnalysisPendingId = "";
      render();
    }).catch(function (error) {
      if (timer) clearTimeout(timer);
      state.homeworkAnalysisPendingId = "";
      state.homeworkAnalysisNotice = "AI 分析暂时不可用（" +
        (error && error.name === "AbortError" ? "超时" : String(error && error.message || error)) +
        "）。请确认本机 AI 服务：运行 uv run fabulita bridge，或在首页「故事工坊」配置模型。";
      render();
    });
  }

    if (result === "known") {
      rec.level = Math.min((+rec.level || 0) + 1, REVIEW_INTERVALS.length);
      rec.dueAt = now + REVIEW_INTERVALS[rec.level - 1] * REVIEW_DAY;
      rec.lastResult = "remembered";
      state.reviewSessionDone += 1;
    } else {
      rec.level = 0;
      rec.dueAt = now;
      rec.lapses = (+rec.lapses || 0) + 1;
      rec.lastResult = "again";
      state.reviewQueue.push(word);
    }
    delete rec.homeworkQueuedAt;
    delete rec.homeworkAssignmentId;
    delete rec.homeworkItemId;
    reviewStore.cards[key] = rec;
    var after = {
      level: +rec.level || 0,
      dueAt: rec.dueAt ? +rec.dueAt : null,
      reviews: +rec.reviews || 0,
      lapses: +rec.lapses || 0,
      lastReviewedAt: +rec.lastReviewedAt || null,
      lastResult: rec.lastResult || null
    };
    state.reviewRevealed = false;
    var scheduleSaved = saveReviewSession();
    var reviewEvent = buildReviewEvent(word, result, inputMethod, before, after, now, scheduleSaved);
    var eventSaved = appendReviewEvent(reviewEvent);
    var learningEventSaved = recordLearningEvent("review", "self_rated", {
      occurredAt: now,
      entityId: reviewEvent.wordKey,
      sessionId: reviewEvent.sessionId,
      attemptId: state.reviewAttemptId,
      legacyEventId: reviewEvent.id,
      word: reviewEvent.word,
      rating: reviewEvent.rating,
      attempt: reviewEvent.reviewsAfter,

      levelBefore: reviewEvent.levelBefore,
      levelAfter: reviewEvent.levelAfter,
      dueAtBefore: reviewEvent.dueAtBefore,
      dueAtAfter: reviewEvent.dueAtAfter,
      snapshotPersisted: scheduleSaved
    });

  var WORD_RE = /\p{L}+/gu;
  // Unspaced scripts (ja/zh): greedy longest-match against glossary keys
  var CJK_MODE = P.config.lang === "ja" || P.config.lang === "zh";
  var maxKeyLen = 1;
  if (CJK_MODE) {
    P.stories.forEach(function (s, i) {
      Object.keys(storyGloss[i]).forEach(function (k) { maxKeyLen = Math.max(maxKeyLen, k.length); });
    });
    Object.keys(baseGloss).forEach(function (k) { maxKeyLen = Math.max(maxKeyLen, k.length); });
    maxKeyLen = Math.min(maxKeyLen, 12);
  }
  var SPEAKER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

  function wordSpan(si, key, display) {
    return '<span class="w" tabindex="0" role="button" data-si="' + si + '" data-key="' + esc(key) + '">' + esc(display) + "</span>";
  }

  function sentenceHtml(si, text) {
    if (CJK_MODE) return sentenceHtmlCJK(si, text);
    var out = "", last = 0, m;
    WORD_RE.lastIndex = 0;
    while ((m = WORD_RE.exec(text)) !== null) {
      out += esc(text.slice(last, m.index));
      var key = norm(m[0]);
      out += glossFor(si, key) ? wordSpan(si, key, m[0]) : esc(m[0]);
      last = m.index + m[0].length;
    }
    return out + esc(text.slice(last));
  }

  function sentenceHtmlCJK(si, text) {
    var out = "", i = 0;
    while (i < text.length) {
      var matched = null;
      var limit = Math.min(maxKeyLen, text.length - i);
      for (var len = limit; len >= 1; len--) {
        var key = norm(text.substr(i, len));
        if (glossFor(si, key)) { matched = { key: key, len: len }; break; }
      }
      if (matched) {
        out += wordSpan(si, matched.key, text.substr(i, matched.len));
        i += matched.len;
      } else {
        out += esc(text[i]);
        i += 1;
      }
    }
    return out;
  }

  function reviewStatus(word) {
    if (!reviewIsEligible(word)) return { key: "excluded", label: "暂不复习" };

    if (!rec.dueAt || +rec.dueAt <= Date.now()) return { key: "due", label: "待复习" };
    if ((+rec.level || 0) >= 3) return { key: "mastered", label: "已掌握" };

  function exportIso(value) { return validEventTime(value) ? new Date(+value).toISOString() : ""; }
  function csvSafeValue(value) {
    var text = value == null ? "" : String(value);

    return '"' + text.replace(/"/g, '""') + '"';
  }
  function reviewHistoryCsv(events) {
    var columns = [
      ["event_id", "id"], ["reviewed_at", "reviewedAt"], ["session_id", "sessionId"],
      ["history_scope", "historyScope"], ["review_scope", "reviewScope"], ["review_version", "reviewVersion"],
      ["language", "language"], ["word_key", "wordKey"], ["word", "word"], ["gloss", "gloss"],
      ["english", "english"], ["accepted_answers", "acceptedAnswers"], ["category", "category"], ["kind", "kind"],
      ["answer_mode", "answerMode"], ["answer_trigger", "answerTrigger"], ["typed_answer", "typedAnswer"],
      ["answer_correct", "answerCorrect"], ["rating", "rating"], ["rating_input", "ratingInput"],
      ["level_before", "levelBefore"], ["level_after", "levelAfter"], ["due_at_before", "dueAtBefore"],
      ["due_at_after", "dueAtAfter"], ["reviews_before", "reviewsBefore"], ["reviews_after", "reviewsAfter"],
      ["lapses_before", "lapsesBefore"], ["lapses_after", "lapsesAfter"], ["card_started_at", "cardStartedAt"],
      ["answer_checked_at", "answerCheckedAt"], ["answer_latency_ms", "answerLatencyMs"],
      ["rating_latency_ms", "ratingLatencyMs"], ["total_latency_ms", "totalLatencyMs"],
      ["matcher_version", "matcherVersion"], ["schedule_persisted", "schedulePersisted"]
    ];
    var isoFields = { reviewedAt: true, dueAtBefore: true, dueAtAfter: true, cardStartedAt: true, answerCheckedAt: true };
    var rows = [columns.map(function (column) { return csvSafeValue(column[0]); }).join(",")];
    events.forEach(function (event) {
      rows.push(columns.map(function (column) {
        var value = isoFields[column[1]] ? exportIso(event[column[1]]) : event[column[1]];
        return csvSafeValue(value);
      }).join(","));
    });
    return "\uFEFF" + rows.join("\r\n") + "\r\n";
  }
  function learningHistoryCsv(events) {
    var columns = [
      ["event_id", "id"], ["occurred_at", "occurredAt"], ["source", "source"], ["action", "action"],
      ["session_id", "sessionId"], ["attempt_id", "attemptId"], ["assignment_id", "assignmentId"],
      ["section_id", "sectionId"], ["entity_id", "entityId"], ["question_type", "questionType"],
      ["word", "word"], ["prompt", "prompt"], ["answer_mode", "answerMode"],
      ["submitted_answer", "submittedAnswer"], ["expected_answers", "expectedAnswers"],
      ["verdict", "verdict"], ["answer_correct", "answerCorrect"], ["rating", "rating"],
      ["meaning_correct", "meaningCorrect"], ["scoring_source", "scoringSource"],
      ["model_version", "modelVersion"], ["rubric_version", "rubricVersion"],
      ["feedback_zh", "feedbackZh"], ["suggested_answer", "suggestedAnswer"],
      ["attempt", "attempt"], ["latency_ms", "latencyMs"], ["snapshot_persisted", "snapshotPersisted"]
    ];
    var rows = [columns.map(function (column) { return csvSafeValue(column[0]); }).join(",")];
    events.forEach(function (event) {
      rows.push(columns.map(function (column) {
        var value = column[1] === "occurredAt" ? exportIso(event.occurredAt) : event[column[1]];
        if (column[1] === "expectedAnswers") value = (event.expectedAnswers || []).join(" | ");
        return csvSafeValue(value);
      }).join(","));
    });
    return "\uFEFF" + rows.join("\r\n") + "\r\n";
  }

  function downloadReviewFile(extension, text, mime) {
    var blob = new Blob([text], { type: mime + ";charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");

  // ── popup ──
  var pop = document.getElementById("pop");

  function hidePop() {

  function showPop(el, si, key) {
    var entry = glossFor(si, key);

    if (activeEl) activeEl.classList.remove("active");

    note.textContent = entry[1] || "";
    note.style.display = entry[1] ? "block" : "none";

    pop.classList.add("show");
    var r = el.getBoundingClientRect();
    var pw = pop.offsetWidth, ph = pop.offsetHeight;
    var cx = r.left + r.width / 2;
    var left = Math.max(8, Math.min(cx - pw / 2, window.innerWidth - pw - 8));
    var below = r.bottom + 10 + ph < window.innerHeight || r.top - 10 - ph < 0;
    pop.classList.toggle("below", below);
    pop.classList.toggle("above", !below);
    pop.style.top = (window.scrollY + (below ? r.bottom + 10 : r.top - ph - 10)) + "px";
    pop.style.left = (window.scrollX + left) + "px";
    pop.style.setProperty("--arrow-x", (cx - left) + "px");
  }

  // ── audio: embedded clips first, speechSynthesis fallback ──
  var synth = window.speechSynthesis;
  var targetVoice = null;
  var player = new Audio();
  var speaking = false, queue = [], utterSeq = 0;
  var currentBtn = null, currentSent = null, currentAllBtn = null;
  var currentHomeworkDialogueBtn = null;
  var hasAudio = P.audio && Object.keys(P.audio).length > 0;

  function pickVoice() {
    var voices = synth ? synth.getVoices() : [];
    var lang = (P.config.lang || "es").toLowerCase();
    var match = voices.filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf(lang) === 0; });
    if (match.length) targetVoice = match[0];
  }
  if (synth) {
    pickVoice();
    if (typeof synth.onvoiceschanged !== "undefined") synth.onvoiceschanged = pickVoice;
  }

  function updateVoiceNote() {
    var el = document.getElementById("voice-note");
    if (!el) return;
    el.textContent = hasAudio ? t("voiceEmbedded") : (synth ? t("voiceSystem") : t("voiceNone"));
  }

  function reviewSpeechText(value) {
    // A slash separates written alternatives; a short pause sounds natural
    // and prevents speech engines from saying "slash" or "barra".
    return String(value == null ? "" : value)
      .replace(/\s*\/\s*/g, ", ");
  }

  function speakTargetText(text) {
    if (!synth || !text) return;
    stopAll();
    var id = ++utterSeq;
    var utterance = new SpeechSynthesisUtterance(reviewSpeechText(text));
    utterance.lang = targetVoice ? targetVoice.lang : (P.config.lang || "es");
    if (targetVoice) utterance.voice = targetVoice;
    utterance.rate = state.slow ? 0.6 : 0.92;
    speaking = true;
    utterance.onend = utterance.onerror = function () {
      if (id === utterSeq) clearPlayState();
    };
    synth.speak(utterance);
  }

  function resetHomeworkDialoguePlayButton() {
    if (!currentHomeworkDialogueBtn) return;
    currentHomeworkDialogueBtn.textContent = "▶ 播放完整对话";
    currentHomeworkDialogueBtn.setAttribute("aria-pressed", "false");
    currentHomeworkDialogueBtn = null;
  }

  function speakHomeworkDialogue(assignment, button) {
    if (!synth || !assignment || !button) return;
    if (currentHomeworkDialogueBtn === button && speaking) {
      stopAll();
      return;
    }
    var scenario = assignment.scenario || {};
    var lines = Array.isArray(scenario.dialogue) ? scenario.dialogue.map(function (line) {
      return line && typeof line.english === "string" ? line.english.trim() : "";
    }).filter(Boolean) : [];
    if (!lines.length) return;
    stopAll();
    var dialogueId = ++utterSeq;
    var lineIndex = 0;
    currentHomeworkDialogueBtn = button;
    button.textContent = "■ 停止播放";
    button.setAttribute("aria-pressed", "true");
    speaking = true;
    function finishDialogue() {
      if (dialogueId !== utterSeq) return;
      speaking = false;
      resetHomeworkDialoguePlayButton();
    }
    function speakNextDialogueLine() {
      if (dialogueId !== utterSeq) return;
      if (lineIndex >= lines.length) {
        finishDialogue();
        return;
      }
      var utterance = new SpeechSynthesisUtterance(reviewSpeechText(lines[lineIndex]));
      utterance.lang = targetVoice ? targetVoice.lang : (P.config.lang || "en");
      if (targetVoice) utterance.voice = targetVoice;
      utterance.rate = state.slow ? 0.6 : 0.92;
      utterance.onend = function () {
        if (dialogueId !== utterSeq) return;
        lineIndex += 1;
        speakNextDialogueLine();
      };
      utterance.onerror = finishDialogue;
      synth.speak(utterance);
    }
    speakNextDialogueLine();
  }

  function speakReviewWord() {
    if (!synth || !state.reviewQueue.length) return;
    stopAll();
    var id = ++utterSeq;
    var utterance = new SpeechSynthesisUtterance(reviewSpeechText(state.reviewQueue[0].w));
    utterance.lang = targetVoice ? targetVoice.lang : (P.config.lang || "es");
    if (targetVoice) utterance.voice = targetVoice;
    utterance.rate = state.slow ? 0.6 : 0.92;
    speaking = true;
    utterance.onend = utterance.onerror = function () {
      if (id === utterSeq) clearPlayState();
    };
    synth.speak(utterance);
  }

  function speakHomeworkStudyText(kind) {
    if (!synth) return;

    var word = assignment && homeworkStudyCurrentWord(assignment);
    if (!word) return;
    var text = kind === "example" ? word.example : word.word;

  function speakHomeworkSentence() {
    if (!synth) return;
    var assignment = homeworkById(state.homeworkId);
    var active = assignment ? homeworkActiveItems(assignment) : [];
    var entry = active[state.homeworkIndex];
    var progress = assignment ? homeworkProgress(assignment) : null;
    var response = entry && progress && progress.responses[entry.item.id];
    var resolved = entry && homeworkResolvedSentence(entry.item, response);
    if (!resolved) return;
    stopAll();
    var id = ++utterSeq;
    var utterance = new SpeechSynthesisUtterance(reviewSpeechText(resolved.target));
    utterance.lang = targetVoice ? targetVoice.lang : (P.config.lang || "es");
    if (targetVoice) utterance.voice = targetVoice;
    utterance.rate = state.slow ? 0.6 : 0.92;
    speaking = true;
    utterance.onend = utterance.onerror = function () {
      if (id === utterSeq) clearPlayState();
    };
    synth.speak(utterance);
  }

  function clearPlayState() {
    speaking = false;
    if (currentBtn) currentBtn.classList.remove("playing");
    if (currentSent) currentSent.classList.remove("playing");
    currentBtn = currentSent = null;
  }

  function stopAll() {
    queue = [];
    utterSeq++; // invalidate onend callbacks of cancelled speech
    if (synth && (synth.speaking || synth.pending) && Date.now() >= wordSpeechUntil) synth.cancel();
    player.pause();
    clearPlayState();
    if (currentAllBtn) { currentAllBtn.textContent = t("playAll"); currentAllBtn = null; }
    resetHomeworkDialoguePlayButton();
  }

  function speakSent(sentEl, onDone) {
    var id = ++utterSeq;
    var done = function () {
      if (id !== utterSeq) return;
      clearPlayState();
      if (onDone) onDone();
    };
    speaking = true;
    currentSent = sentEl;
    currentBtn = sentEl.querySelector(".say");
    sentEl.classList.add("playing");
    if (currentBtn) currentBtn.classList.add("playing");

    var inlineSource = sentEl.querySelector(".review-example-source");
    var story = inlineSource ? null : P.stories[+sentEl.dataset.si];
    var sentIndex = +sentEl.dataset.i;
    var storySentence = story && story.sentences && story.sentences[sentIndex];
    var clip = story && P.audio && P.audio[story.id] && P.audio[story.id][sentEl.dataset.i];
    if (clip) {
      player.src = clip;
      player.playbackRate = state.slow ? 0.65 : 1.0;
      player.onended = player.onerror = done;
      player.play().catch(done);
    } else if (synth) {
      var text = inlineSource ? inlineSource.textContent : (storySentence && storySentence.text);
      text = String(text || "").replace(/[«»]/g, "").trim();
      if (!text) { done(); return; }
      var u = new SpeechSynthesisUtterance(text);
      u.lang = targetVoice ? targetVoice.lang : (P.config.lang || "es");
      if (targetVoice) u.voice = targetVoice;
      u.rate = state.slow ? 0.6 : 0.92;
      u.onend = u.onerror = done;
      synth.speak(u);
    } else {
      done();
    }
  }

  function playQueue(sents, allBtn) {
    stopAll();
    queue = sents;
    currentAllBtn = allBtn;
    if (allBtn) allBtn.textContent = t("stop");
    (function next() {
      if (!queue.length) {
        if (currentAllBtn) { currentAllBtn.textContent = t("playAll"); currentAllBtn = null; }
        return;
      }
      speakSent(queue.shift(), next);
    })();
  }

        var homeworkMultiAnswer = {};

          homeworkMultiAnswer[input.dataset.homeworkBlank || ""] = input.value.trim();
          if (!input.value.trim() && !homeworkMultiMissing) homeworkMultiMissing = input;

          render();

            homeworkMultiFeedback.scrollIntoView({ behavior: "smooth", block: "nearest" });
          }

      var homeworkChoiceInput = e.target.querySelector('input[name="homework-answer"]:checked');

          homeworkTextInput.setAttribute("aria-invalid", "true");
          homeworkTextInput.focus();

      state.chatDraft = e.target.value;
      return;
    }
  });

  document.addEventListener("change", function (e) {
    if (!VOCAB_DASHBOARD || !e.target) return;
    if (e.target.id === "homework-study-filter") {
      state.homeworkStudyRole = ["answer", "context"].indexOf(e.target.value) !== -1 ? e.target.value : "all";
      updateHomeworkStudyList();
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.id === "chat-input") {
      e.preventDefault();
      state.chatDraft = e.target.value;
      sendChatMessage(state.chatDraft);
      render();
      return;
    }
    if (e.key === "Escape") {
      hidePop();
      if (state.dashboardNav === "qa" && state.qaDeleteArmed) {
        state.qaDeleteArmed = null;
        render();
        return;
      }
    }
    var a = document.activeElement;
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && a && a.id === "qa-question-input") {
      e.preventDefault();
      if (a.form && typeof a.form.requestSubmit === "function") a.form.requestSubmit();
      return;
    }
    if (VOCAB_DASHBOARD && state.dashboardNav === "homework" && state.homeworkId &&
        /^[a-zA-Z]$/.test(e.key) && !e.metaKey && !e.ctrlKey && !e.altKey &&
        !(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName || "") && a.type !== "radio") &&
        document.getElementById("homework-answer-form")) {
      if (selectHomeworkOptionByLetter(e.key)) {
        e.preventDefault();
        var chosenRadio = document.querySelector('input[name="homework-answer"]:checked');
        if (chosenRadio) chosenRadio.focus();
        return;
      }
    }
    var reviewSurfaceVisible = !VOCAB_DASHBOARD || !!document.getElementById("dashboard-review-card");
    if (reviewSurfaceVisible && (state.view === "review" || state.view === "vocab") && !e.metaKey && !e.ctrlKey && !e.altKey) {
      var interactive = a && /^(BUTTON|A|INPUT|TEXTAREA|SELECT)$/.test(a.tagName || "");
      if (!state.reviewRevealed && (e.key === " " || e.key === "Enter") && !interactive && state.reviewQueue.length) {
        e.preventDefault();
        revealReviewAnswer("skipped", "manual_keyboard");
        render();
        return;
      }
      if (state.reviewRevealed && e.key === "1") { e.preventDefault(); rateReview("again", "keyboard"); return; }
      if (state.reviewRevealed && VOCAB_DASHBOARD && e.key === "2") { e.preventDefault(); reportReviewIssue(); return; }
      if (state.reviewRevealed && ((VOCAB_DASHBOARD && e.key === "3") || (!VOCAB_DASHBOARD && e.key === "2"))) {
        e.preventDefault(); rateReview("known", "keyboard"); return;
      }
    }
    if ((e.key === "Enter" || e.key === " ") && a && a.classList && a.classList.contains("w")) {
      e.preventDefault();
      showPop(a, +a.dataset.si, a.dataset.key);
    }
  });
  window.addEventListener("scroll", hidePop, { passive: true });
  window.addEventListener("resize", hidePop);

  if (state.view === "review" || state.view === "vocab") startReviewSession(false);
  render();
})();
</script>
