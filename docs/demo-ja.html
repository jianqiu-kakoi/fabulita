<title>日本語 · N5 · 読み物</title>
<style>
  :root {
    --bg: #F6F4EE;
    --card: #FFFFFF;

      --gold: #D5A54E; --line: #33363E; --underline: rgba(138, 176, 232, 0.5);
      --pop-bg: #F2F0E9; --pop-ink: #262A33; --pop-muted: #5C6470;

  }
  :root[data-theme="light"] {
    --bg: #F6F4EE; --card: #FFFFFF; --ink: #2A2620; --muted: #6F695E;
    --accent: #2F5DA8; --accent-deep: #24497F; --accent-soft: rgba(47, 93, 168, 0.09);
    --gold: #B8860B; --line: #E4DFD4; --underline: rgba(47, 93, 168, 0.45);
    --pop-bg: #262A33; --pop-ink: #F2F0E9; --pop-muted: #A8B0BE;
  }
  :root[data-theme="dark"] {
    --bg: #1A1C21; --card: #22252C; --ink: #E7E3D9; --muted: #9A948A;
    --accent: #8AB0E8; --accent-deep: #A8C6F0; --accent-soft: rgba(138, 176, 232, 0.12);
    --gold: #D5A54E; --line: #33363E; --underline: rgba(138, 176, 232, 0.5);

  * { box-sizing: border-box; }

  }

  .homelink a:hover { color: var(--accent-deep); border-color: var(--accent); }
  h1 { font-family: var(--serif); font-size: 2rem; font-weight: 600; margin: 0 0 0.5rem; text-wrap: balance; }
  .hint { color: var(--muted); font-size: 0.9rem; margin: 0; }

  .ctl:hover { border-color: var(--accent); }
  .ctl[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--card); }
  .ctl-note { font-size: 0.78rem; color: var(--muted); }

  .mode-tabs {
    display: inline-flex; gap: 0.3rem; padding: 0.25rem; margin-top: 1.15rem;
    border: 1px solid var(--line); border-radius: 100px; background: var(--card);
  }
  .mode-tab {
    display: inline-flex; align-items: center; gap: 0.45rem;

  .mode-tab:hover { color: var(--accent-deep); }
  .mode-tab[aria-pressed="true"] { background: var(--accent); color: var(--card); }
  .mode-count {
    min-width: 1.25rem; padding: 0 0.35rem; border-radius: 100px;

  }
  .mode-tab[aria-pressed="true"] .mode-count { background: rgba(255,255,255,0.2); color: inherit; }

  .review-overview {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.65rem;
    margin-bottom: 1rem;
  }
  .review-stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 0.75rem 0.9rem;
  }
  .review-stat strong {
    display: block; color: var(--accent-deep); font-family: var(--serif);
    font-size: 1.4rem; line-height: 1.2; font-variant-numeric: tabular-nums;
  }
  .review-stat span { color: var(--muted); font-size: 0.75rem; }
  .review-progress { grid-column: span 1; }
  .review-progress .cov-bar { margin: 0.45rem 0 0; }

  .review-panel {
    min-height: 23rem; display: flex; flex-direction: column; justify-content: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 2rem; text-align: center;

  .review-word-say { margin-top: 0.8rem; align-self: center; }

  .review-note { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.86rem; }
  .review-answer-form { width: min(100%, 28rem); margin: 1.35rem auto 0; text-align: left; }
  .review-answer-label { display: block; margin-bottom: 0.45rem; font-size: 0.78rem; font-weight: 700; }
  .review-answer-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.55rem; }
  .review-answer-input {
    min-width: 0; height: 2.75rem; padding: 0 0.85rem; border: 1px solid var(--line);
    border-radius: 9px; background: var(--card); color: var(--ink); font: 0.9rem var(--sans); outline: none;
  }
  .review-answer-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .review-answer-input[aria-invalid="true"] { border-color: #b54b3b; }
  .review-answer-check {
    min-height: 2.75rem; padding: 0 1rem; border: 1px solid var(--accent); border-radius: 9px;
    background: var(--accent); color: var(--card); font: 700 0.82rem var(--sans); cursor: pointer;
  }
  .review-answer-check:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
  .review-answer-hint { margin: 0.42rem 0 0; color: var(--muted); font-size: 0.7rem; }

    background: var(--accent-soft); text-align: left;
  }
  .review-example-label {

  .review-example-text { margin: 0; font-family: var(--serif); font-size: 1.04rem; line-height: 1.8; }
  .review-example-trans { margin: 0.3rem 0 0; color: var(--muted); font-size: 0.82rem; }
  .review-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 1.3rem; }
  .review-action {
    font-family: var(--sans); padding: 0.7rem 0.8rem; border: 1px solid var(--line);

  }
  .review-action:hover { border-color: var(--accent); }
  .review-action:disabled { opacity: 0.62; cursor: default; }
  .review-action.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
  .review-action strong { display: block; font-size: 0.88rem; }
  .review-action small { display: block; margin-top: 0.1rem; opacity: 0.72; font-size: 0.7rem; }
  .review-issue-notice {
    margin: 0.75rem 0 0; color: var(--muted); font-size: 0.72rem; line-height: 1.5; text-align: center;
  }
  .review-issue-notice.is-error { color: #9e3f2f; }
  .review-reveal { margin-top: 1.6rem; padding-inline: 1.25rem; }
  .review-empty h2 { margin: 0; font-family: var(--serif); font-size: 1.55rem; }
  .review-empty p { margin: 0.5rem auto 1.2rem; max-width: 27rem; color: var(--muted); }

  /* Vocabulary-first learning dashboard. Kept fully scoped so the reader stays book-like. */

    min-height: 100vh; padding: 0; background: #f7f3ea; color: #17202a; line-height: 1.5;
  }
  .wrap.vocab-dashboard-wrap { width: 100%; max-width: none; margin: 0; }

  .qa-compose, .qa-list-panel {
    border: 1px solid var(--v-line); border-radius: 13px; background: rgba(255,255,255,0.75);

  }
  .qa-compose { position: sticky; top: 1rem; padding: 1.4rem; }

  .qa-label { display: block; margin-bottom: 0.45rem; font-size: 0.78rem; font-weight: 750; }
  .qa-textarea {

  .qa-form-foot { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-top: 0.7rem; }
  .qa-shortcut { color: var(--v-muted); font-size: 0.68rem; }

  }
  .qa-save:hover { background: var(--v-accent-deep); border-color: var(--v-accent-deep); }
  .qa-notice { min-height: 1.2rem; margin: 0.65rem 0 0; color: var(--v-mint-ink); font-size: 0.72rem; }
  .qa-list-panel { min-width: 0; overflow: hidden; }

  .homework-main { min-width: 0; padding: 2.15rem clamp(1.2rem, 3vw, 3.25rem) 3rem; }

  function homeworkSentenceSegments(assignment, sentence) {

          word: matched.word,

  function nextKnownDays(word) {
    var rec = reviewRecord(word);

  }
  function rateReview(result, inputMethod) {
    if (["again", "known"].indexOf(result) === -1) return;
    var word = state.reviewQueue.shift();
    if (!word) return;
    refreshReviewStore(false);
    var key = reviewCardKey(word), now = Date.now();
    var rec = reviewStore.cards[key] || { level: 0, reviews: 0, lapses: 0 };
    var before = {
      level: +rec.level || 0,
      dueAt: rec.dueAt ? +rec.dueAt : null,
      reviews: +rec.reviews || 0,
      lapses: +rec.lapses || 0,
      lastReviewedAt: rec.lastReviewedAt ? +rec.lastReviewedAt : null,
      lastResult: rec.lastResult || null
    };
    rec.reviews = (+rec.reviews || 0) + 1;
    rec.lastReviewedAt = now;
    if (result === "known") {
      rec.level = Math.min((+rec.level || 0) + 1, REVIEW_INTERVALS.length);
      rec.dueAt = now + REVIEW_INTERVALS[rec.level - 1] * REVIEW_DAY;
      rec.lastResult = "remembered";
      state.reviewSessionDone += 1;
    } else {
      rec.level = 0;
      rec.dueAt = now;
      rec.lapses = (+rec.lapses || 0) + 1;
      rec.lastResult = "again";
      state.reviewQueue.push(word);
    }
    delete rec.homeworkQueuedAt;
    delete rec.homeworkAssignmentId;
    delete rec.homeworkItemId;
    reviewStore.cards[key] = rec;
    var after = {
      level: +rec.level || 0,
      dueAt: rec.dueAt ? +rec.dueAt : null,
      reviews: +rec.reviews || 0,
      lapses: +rec.lapses || 0,
      lastReviewedAt: +rec.lastReviewedAt || null,
      lastResult: rec.lastResult || null
    };
    state.reviewRevealed = false;
    var scheduleSaved = saveReviewSession();
    var reviewEvent = buildReviewEvent(word, result, inputMethod, before, after, now, scheduleSaved);
    var eventSaved = appendReviewEvent(reviewEvent);
    var learningEventSaved = recordLearningEvent("review", "self_rated", {
      occurredAt: now,
      entityId: reviewEvent.wordKey,
      sessionId: reviewEvent.sessionId,
      attemptId: state.reviewAttemptId,
      legacyEventId: reviewEvent.id,
      word: reviewEvent.word,
      rating: reviewEvent.rating,
      attempt: reviewEvent.reviewsAfter,
      latencyMs: reviewEvent.totalLatencyMs,
      levelBefore: reviewEvent.levelBefore,
      levelAfter: reviewEvent.levelAfter,

    state.reviewHistoryNotice = (!scheduleSaved && !eventSaved && !learningEventSaved) ?

  var WORD_RE = /\p{L}+/gu;
  // Unspaced scripts (ja/zh): greedy longest-match against glossary keys
  var CJK_MODE = P.config.lang === "ja" || P.config.lang === "zh";
  var maxKeyLen = 1;
  if (CJK_MODE) {
    P.stories.forEach(function (s, i) {
      Object.keys(storyGloss[i]).forEach(function (k) { maxKeyLen = Math.max(maxKeyLen, k.length); });
    });
    Object.keys(baseGloss).forEach(function (k) { maxKeyLen = Math.max(maxKeyLen, k.length); });
    maxKeyLen = Math.min(maxKeyLen, 12);
  }
  var SPEAKER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

  function wordSpan(si, key, display) {
    return '<span class="w" tabindex="0" role="button" data-si="' + si + '" data-key="' + esc(key) + '">' + esc(display) + "</span>";
  }

  function sentenceHtml(si, text) {
    if (CJK_MODE) return sentenceHtmlCJK(si, text);
    var out = "", last = 0, m;
    WORD_RE.lastIndex = 0;
    while ((m = WORD_RE.exec(text)) !== null) {
      out += esc(text.slice(last, m.index));
      var key = norm(m[0]);
      out += glossFor(si, key) ? wordSpan(si, key, m[0]) : esc(m[0]);
      last = m.index + m[0].length;
    }
    return out + esc(text.slice(last));
  }

  function sentenceHtmlCJK(si, text) {
    var out = "", i = 0;
    while (i < text.length) {
      var matched = null;
      var limit = Math.min(maxKeyLen, text.length - i);
      for (var len = limit; len >= 1; len--) {
        var key = norm(text.substr(i, len));
        if (glossFor(si, key)) { matched = { key: key, len: len }; break; }
      }
      if (matched) {
        out += wordSpan(si, matched.key, text.substr(i, matched.len));
        i += matched.len;
      } else {
        out += esc(text[i]);
        i += 1;
      }
    }
    return out;
  }

    var ratings = { again: 0, hard: 0, known: 0 };

    return {

      today: events.filter(function (event) { return event.reviewedAt >= +today; }).length,
      typed: typed.length,

      accuracy: typed.length ? Math.round(100 * correct / typed.length) : null,

      root.scopes[scopeKey] : null;

  function learningEventSummary(events) {
    var summary = { total: events.length, answerAttempts: 0, selfRatings: 0, bySource: {}, byAction: {}, byVerdict: {} };

      }

    });
    return summary;

  function exportIso(value) { return validEventTime(value) ? new Date(+value).toISOString() : ""; }
  function csvSafeValue(value) {
    var text = value == null ? "" : String(value);
    if (/^[\s]*[=+\-@]/.test(text)) text = "'" + text;
    return '"' + text.replace(/"/g, '""') + '"';
  }
  function reviewHistoryCsv(events) {
    var columns = [
      ["event_id", "id"], ["reviewed_at", "reviewedAt"], ["session_id", "sessionId"],
      ["history_scope", "historyScope"], ["review_scope", "reviewScope"], ["review_version", "reviewVersion"],
      ["language", "language"], ["word_key", "wordKey"], ["word", "word"], ["gloss", "gloss"],
      ["english", "english"], ["accepted_answers", "acceptedAnswers"], ["category", "category"], ["kind", "kind"],
      ["answer_mode", "answerMode"], ["answer_trigger", "answerTrigger"], ["typed_answer", "typedAnswer"],
      ["answer_correct", "answerCorrect"], ["rating", "rating"], ["rating_input", "ratingInput"],
      ["level_before", "levelBefore"], ["level_after", "levelAfter"], ["due_at_before", "dueAtBefore"],
      ["due_at_after", "dueAtAfter"], ["reviews_before", "reviewsBefore"], ["reviews_after", "reviewsAfter"],
      ["lapses_before", "lapsesBefore"], ["lapses_after", "lapsesAfter"], ["card_started_at", "cardStartedAt"],
      ["answer_checked_at", "answerCheckedAt"], ["answer_latency_ms", "answerLatencyMs"],
      ["rating_latency_ms", "ratingLatencyMs"], ["total_latency_ms", "totalLatencyMs"],
      ["matcher_version", "matcherVersion"], ["schedule_persisted", "schedulePersisted"]
    ];
    var isoFields = { reviewedAt: true, dueAtBefore: true, dueAtAfter: true, cardStartedAt: true, answerCheckedAt: true };
    var rows = [columns.map(function (column) { return csvSafeValue(column[0]); }).join(",")];
    events.forEach(function (event) {
      rows.push(columns.map(function (column) {
        var value = isoFields[column[1]] ? exportIso(event[column[1]]) : event[column[1]];
        return csvSafeValue(value);
      }).join(","));
    });
    return "\uFEFF" + rows.join("\r\n") + "\r\n";
  }
  function learningHistoryCsv(events) {
    var columns = [
      ["event_id", "id"], ["occurred_at", "occurredAt"], ["source", "source"], ["action", "action"],
      ["session_id", "sessionId"], ["attempt_id", "attemptId"], ["assignment_id", "assignmentId"],
      ["section_id", "sectionId"], ["entity_id", "entityId"], ["question_type", "questionType"],
      ["word", "word"], ["prompt", "prompt"], ["answer_mode", "answerMode"],
      ["submitted_answer", "submittedAnswer"], ["expected_answers", "expectedAnswers"],
      ["verdict", "verdict"], ["answer_correct", "answerCorrect"], ["rating", "rating"],
      ["meaning_correct", "meaningCorrect"], ["scoring_source", "scoringSource"],
      ["model_version", "modelVersion"], ["rubric_version", "rubricVersion"],
      ["feedback_zh", "feedbackZh"], ["suggested_answer", "suggestedAnswer"],
      ["attempt", "attempt"], ["latency_ms", "latencyMs"], ["snapshot_persisted", "snapshotPersisted"]
    ];
    var rows = [columns.map(function (column) { return csvSafeValue(column[0]); }).join(",")];
    events.forEach(function (event) {
      rows.push(columns.map(function (column) {
        var value = column[1] === "occurredAt" ? exportIso(event.occurredAt) : event[column[1]];
        if (column[1] === "expectedAnswers") value = (event.expectedAnswers || []).join(" | ");
        return csvSafeValue(value);
      }).join(","));
    });
    return "\uFEFF" + rows.join("\r\n") + "\r\n";
  }

  function downloadReviewFile(extension, text, mime) {
    var blob = new Blob([text], { type: mime + ";charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = exportFileSlug() + "-review-history-" + new Date().toISOString().slice(0, 10) + "." + extension;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  // ── popup ──
  var pop = document.getElementById("pop");
  var activeEl = null;

  function hidePop() {
    pop.classList.remove("show");
    if (activeEl) activeEl.classList.remove("active");
    activeEl = null;
  }

  function showPop(el, si, key) {
    var entry = glossFor(si, key);
    if (!entry) return;
    if (activeEl === el) { hidePop(); return; }
    if (activeEl) activeEl.classList.remove("active");
    activeEl = el;
    el.classList.add("active");

    document.getElementById("pop-word").textContent = el.textContent;
    document.getElementById("pop-gloss").textContent = entry[0];
    var note = document.getElementById("pop-note");
    note.textContent = entry[1] || "";
    note.style.display = entry[1] ? "block" : "none";

    pop.classList.add("show");
    var r = el.getBoundingClientRect();
    var pw = pop.offsetWidth, ph = pop.offsetHeight;
    var cx = r.left + r.width / 2;
    var left = Math.max(8, Math.min(cx - pw / 2, window.innerWidth - pw - 8));
    var below = r.bottom + 10 + ph < window.innerHeight || r.top - 10 - ph < 0;
    pop.classList.toggle("below", below);
    pop.classList.toggle("above", !below);
    pop.style.top = (window.scrollY + (below ? r.bottom + 10 : r.top - ph - 10)) + "px";
    pop.style.left = (window.scrollX + left) + "px";
    pop.style.setProperty("--arrow-x", (cx - left) + "px");
  }

  // ── audio: embedded clips first, speechSynthesis fallback ──
  var synth = window.speechSynthesis;
  var targetVoice = null;
  var player = new Audio();
  var speaking = false, queue = [], utterSeq = 0;
  var currentBtn = null, currentSent = null, currentAllBtn = null;
  var currentHomeworkDialogueBtn = null;
  var hasAudio = P.audio && Object.keys(P.audio).length > 0;

  function pickVoice() {
    var voices = synth ? synth.getVoices() : [];
    var lang = (P.config.lang || "es").toLowerCase();
    var match = voices.filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf(lang) === 0; });
    if (match.length) targetVoice = match[0];
  }
  if (synth) {
    pickVoice();
    if (typeof synth.onvoiceschanged !== "undefined") synth.onvoiceschanged = pickVoice;
  }

  function updateVoiceNote() {
    var el = document.getElementById("voice-note");
    if (!el) return;
    el.textContent = hasAudio ? t("voiceEmbedded") : (synth ? t("voiceSystem") : t("voiceNone"));
  }

  function reviewSpeechText(value) {
    // A slash separates written alternatives; a short pause sounds natural
    // and prevents speech engines from saying "slash" or "barra".
    return String(value == null ? "" : value)
      .replace(/\s*\/\s*/g, ", ");
  }

  function speakTargetText(text) {
    if (!synth || !text) return;
    stopAll();
    var id = ++utterSeq;
    var utterance = new SpeechSynthesisUtterance(reviewSpeechText(text));
    utterance.lang = targetVoice ? targetVoice.lang : (P.config.lang || "es");
    if (targetVoice) utterance.voice = targetVoice;
    utterance.rate = state.slow ? 0.6 : 0.92;
    speaking = true;
    utterance.onend = utterance.onerror = function () {
      if (id === utterSeq) clearPlayState();
    };
    synth.speak(utterance);
  }

  function resetHomeworkDialoguePlayButton() {
    if (!currentHomeworkDialogueBtn) return;
    currentHomeworkDialogueBtn.textContent = "▶ 播放完整对话";
    currentHomeworkDialogueBtn.setAttribute("aria-pressed", "false");
    currentHomeworkDialogueBtn = null;
  }

  function speakHomeworkDialogue(assignment, button) {
    if (!synth || !assignment || !button) return;
    if (currentHomeworkDialogueBtn === button && speaking) {
      stopAll();
      return;
    }
    var scenario = assignment.scenario || {};
    var lines = Array.isArray(scenario.dialogue) ? scenario.dialogue.map(function (line) {
      return line && typeof line.english === "string" ? line.english.trim() : "";
    }).filter(Boolean) : [];
    if (!lines.length) return;
    stopAll();
    var dialogueId = ++utterSeq;
    var lineIndex = 0;
    currentHomeworkDialogueBtn = button;
    button.textContent = "■ 停止播放";
    button.setAttribute("aria-pressed", "true");
    speaking = true;
    function finishDialogue() {
      if (dialogueId !== utterSeq) return;
      speaking = false;
      resetHomeworkDialoguePlayButton();
    }
    function speakNextDialogueLine() {
      if (dialogueId !== utterSeq) return;
      if (lineIndex >= lines.length) {
        finishDialogue();
        return;
      }
      var utterance = new SpeechSynthesisUtterance(reviewSpeechText(lines[lineIndex]));
      utterance.lang = targetVoice ? targetVoice.lang : (P.config.lang || "en");
      if (targetVoice) utterance.voice = targetVoice;
      utterance.rate = state.slow ? 0.6 : 0.92;
      utterance.onend = function () {
        if (dialogueId !== utterSeq) return;
        lineIndex += 1;
        speakNextDialogueLine();
      };
      utterance.onerror = finishDialogue;
      synth.speak(utterance);
    }
    speakNextDialogueLine();
  }

  function speakReviewWord() {
    if (!synth || !state.reviewQueue.length) return;
    stopAll();
    var id = ++utterSeq;
    var utterance = new SpeechSynthesisUtterance(reviewSpeechText(state.reviewQueue[0].w));
    utterance.lang = targetVoice ? targetVoice.lang : (P.config.lang || "es");
    if (targetVoice) utterance.voice = targetVoice;
    utterance.rate = state.slow ? 0.6 : 0.92;
    speaking = true;
    utterance.onend = utterance.onerror = function () {
      if (id === utterSeq) clearPlayState();
    };
    synth.speak(utterance);
  }

  function speakHomeworkStudyText(kind) {
    if (!synth) return;
    var assignment = homeworkById(state.homeworkId);
    var word = assignment && homeworkStudyCurrentWord(assignment);
    if (!word) return;
    var text = kind === "example" ? word.example : word.word;
    if (!text) return;
    stopAll();
    var id = ++utterSeq;
    var utterance = new SpeechSynthesisUtterance(reviewSpeechText(text));
    utterance.lang = targetVoice ? targetVoice.lang : (P.config.lang || "es");
    if (targetVoice) utterance.voice = targetVoice;
    utterance.rate = state.slow ? 0.6 : 0.92;
    speaking = true;
    utterance.onend = utterance.onerror = function () {
      if (id === utterSeq) clearPlayState();
    };
    synth.speak(utterance);
  }

  function speakHomeworkSentence() {
    if (!synth) return;
    var assignment = homeworkById(state.homeworkId);
    var active = assignment ? homeworkActiveItems(assignment) : [];
    var entry = active[state.homeworkIndex];
    var progress = assignment ? homeworkProgress(assignment) : null;
    var response = entry && progress && progress.responses[entry.item.id];
    var resolved = entry && homeworkResolvedSentence(entry.item, response);
    if (!resolved) return;
    stopAll();
    var id = ++utterSeq;
    var utterance = new SpeechSynthesisUtterance(reviewSpeechText(resolved.target));
    utterance.lang = targetVoice ? targetVoice.lang : (P.config.lang || "es");
    if (targetVoice) utterance.voice = targetVoice;
    utterance.rate = state.slow ? 0.6 : 0.92;
    speaking = true;
    utterance.onend = utterance.onerror = function () {
      if (id === utterSeq) clearPlayState();
    };
    synth.speak(utterance);
  }

  function clearPlayState() {
    speaking = false;
    if (currentBtn) currentBtn.classList.remove("playing");
    if (currentSent) currentSent.classList.remove("playing");
    currentBtn = currentSent = null;
  }

  function stopAll() {
    queue = [];
    utterSeq++; // invalidate onend callbacks of cancelled speech
    if (synth) synth.cancel();
    player.pause();
    clearPlayState();
    if (currentAllBtn) { currentAllBtn.textContent = t("playAll"); currentAllBtn = null; }
    resetHomeworkDialoguePlayButton();
  }

  function speakSent(sentEl, onDone) {
    var id = ++utterSeq;
    var done = function () {
      if (id !== utterSeq) return;
      clearPlayState();
      if (onDone) onDone();
    };
    speaking = true;
    currentSent = sentEl;
    currentBtn = sentEl.querySelector(".say");
    sentEl.classList.add("playing");
    if (currentBtn) currentBtn.classList.add("playing");

    var inlineSource = sentEl.querySelector(".review-example-source");
    var story = inlineSource ? null : P.stories[+sentEl.dataset.si];
    var sentIndex = +sentEl.dataset.i;
    var storySentence = story && story.sentences && story.sentences[sentIndex];
    var clip = story && P.audio && P.audio[story.id] && P.audio[story.id][sentEl.dataset.i];
    if (clip) {
      player.src = clip;
      player.playbackRate = state.slow ? 0.65 : 1.0;
      player.onended = player.onerror = done;
      player.play().catch(done);
    } else if (synth) {
      var text = inlineSource ? inlineSource.textContent : (storySentence && storySentence.text);
      text = String(text || "").replace(/[«»]/g, "").trim();
      if (!text) { done(); return; }
      var u = new SpeechSynthesisUtterance(text);
      u.lang = targetVoice ? targetVoice.lang : (P.config.lang || "es");
      if (targetVoice) u.voice = targetVoice;
      u.rate = state.slow ? 0.6 : 0.92;
      u.onend = u.onerror = done;
      synth.speak(u);
    } else {
      done();
    }
  }

  function playQueue(sents, allBtn) {
    stopAll();
    queue = sents;
    currentAllBtn = allBtn;
    if (allBtn) allBtn.textContent = t("stop");
    (function next() {
      if (!queue.length) {
        if (currentAllBtn) { currentAllBtn.textContent = t("playAll"); currentAllBtn = null; }
        return;
      }
      speakSent(queue.shift(), next);
    })();
  }

  function disarmDelete() {
    if (delArmed === null) return;
    delArmed = null;
    var btns = document.querySelectorAll(".del-story");
    for (var i = 0; i < btns.length; i++) btns[i].textContent = t("delStory");
  }

  // ── events (delegated; DOM is re-rendered on language switch) ──
  document.addEventListener("click", function (e) {
    var el;
    if (P.self && (el = e.target.closest(".del-story"))) {
      var sid = el.dataset.del, pid = el.dataset.pid;
      if (delArmed !== sid) {
        delArmed = sid;
        var btns = document.querySelectorAll(".del-story");
        for (var i = 0; i < btns.length; i++) {
          btns[i].textContent = (btns[i].dataset.del === sid) ? t("delConfirm") : t("delStory");
        }
        return;
      }
      delArmed = null;
      if (el.dataset.builtin) {
        try {
          var hdd = JSON.parse(localStorage.getItem("fabulita.hiddenDemo")) || {};
          var lg = P.config.lang;
          if ((hdd[lg] || []).indexOf(sid) === -1) hdd[lg] = (hdd[lg] || []).concat([sid]);
          localStorage.setItem("fabulita.hiddenDemo", JSON.stringify(hdd));
        } catch (err) {}
        location.reload();
        return;
      }
      try {
        var all = JSON.parse(localStorage.getItem("fabulita.studio.projects")) || {};
        var pr = all[pid];
        if (pr && pr.stories) {
          pr.stories = pr.stories.filter(function (x) { return x.id !== sid; });
          localStorage.setItem("fabulita.studio.projects", JSON.stringify(all));
        }
      } catch (err) {}
      location.reload();
      return;
    }
    if (P.self && (el = e.target.closest("#restore-demo"))) {
      try {
        var hdr = JSON.parse(localStorage.getItem("fabulita.hiddenDemo")) || {};
        delete hdr[P.config.lang];
        localStorage.setItem("fabulita.hiddenDemo", JSON.stringify(hdr));
      } catch (err) {}
      location.reload();
      return;
    }
    disarmDelete();
    if ((el = e.target.closest("[data-homework-reference-toggle]"))) {
      var referenceDetails = el.closest("details");
      state.homeworkReferenceOpen = !(referenceDetails && referenceDetails.open);
      return;
    }
    if ((el = e.target.closest("[data-homework-teaching-word]"))) {
      var teachingWordKey = el.dataset.homeworkTeachingWord || "";
      var teachingWordWasOpen = state.homeworkTeachingWordKey === teachingWordKey;
      stopAll();
      state.homeworkTeachingWordKey =
        teachingWordWasOpen ? "" : teachingWordKey;
      render();
      if (state.homeworkTeachingWordKey) {
        var detailParts = state.homeworkTeachingWordKey.split(":");
        var teachingWordDetail = document.getElementById("homework-teaching-word-detail-" + detailParts[0]);
        if (teachingWordDetail) teachingWordDetail.focus();
      } else {
        var teachingWordButtons = document.querySelectorAll("[data-homework-teaching-word]");
        for (var teachingButtonIndex = 0; teachingButtonIndex < teachingWordButtons.length; teachingButtonIndex++) {
          if (teachingWordButtons[teachingButtonIndex].dataset.homeworkTeachingWord === teachingWordKey) {
            teachingWordButtons[teachingButtonIndex].focus();
            break;
          }
        }
      }
      return;
    }
    if ((el = e.target.closest("[data-homework-sentence-word]"))) {
      var sentenceHomework = homeworkById(state.homeworkId);
      if (VOCAB_DASHBOARD && sentenceHomework &&
          toggleHomeworkSentenceWord(sentenceHomework, el.dataset.homeworkSentenceWord)) {
        render();
      }
      return;
    }
    if ((el = e.target.closest("[data-homework-sentence-speak]"))) {
      speakHomeworkSentence();
      return;
    }
    if ((el = e.target.closest("[data-homework-dialogue-play]"))) {
      var dialogueHomework = homeworkById(state.homeworkId);
      if (VOCAB_DASHBOARD && dialogueHomework) {
        speakHomeworkDialogue(dialogueHomework, el);
      }
      return;
    }
    if ((el = e.target.closest("[data-homework-answer-speak]"))) {
      speakTargetText(el.dataset.homeworkAnswerSpeak);
      return;
    }
    if ((el = e.target.closest("[data-homework-study-open]"))) {
      var studyHomework = homeworkById(el.dataset.homeworkStudyOpen);
      if (VOCAB_DASHBOARD && studyHomework) {
        openHomeworkStudy(studyHomework);
        render();
        var studyCardTitle = document.getElementById("homework-study-card-title");
        if (studyCardTitle) studyCardTitle.focus();
      }
      return;
    }
    if ((el = e.target.closest("[data-homework-study-word]"))) {
      var wordHomework = homeworkById(state.homeworkId);
      if (VOCAB_DASHBOARD && wordHomework &&
          homeworkStudySetCurrent(wordHomework, el.dataset.homeworkStudyWord)) {
        render();
        var selectedStudyTitle = document.getElementById("homework-study-card-title");
        if (selectedStudyTitle) selectedStudyTitle.focus();
      }
      return;
    }
    if ((el = e.target.closest("[data-homework-study-speak]"))) {
      speakHomeworkStudyText(el.dataset.homeworkStudySpeak);
      return;
    }
    if ((el = e.target.closest("[data-homework-study-action]"))) {
      var studyAction = el.dataset.homeworkStudyAction;
      if (studyAction === "reveal") {
        recordHomeworkStudyResult("revealed");
        render();
      } else if (studyAction === "again" || studyAction === "known") {
        rateHomeworkStudy(studyAction);
        render();
        var nextStudyTitle = document.getElementById("homework-study-card-title");
        if (nextStudyTitle) nextStudyTitle.focus();
      }
      return;
    }
    if ((el = e.target.closest("[data-homework-tab]"))) {
      var tabHomework = homeworkById(state.homeworkId);
      var homeworkTab = el.dataset.homeworkTab;
      if (VOCAB_DASHBOARD && tabHomework && homeworkIsScenario(tabHomework)) {
        var scenarioPracticeIndex = state.homeworkIndex;
        var scenarioPracticeSummary = state.homeworkSummary;
        var scenarioPracticeRetryIds = state.homeworkRetryIds.slice();
        stopAll();
        if (homeworkTab === "teaching") openHomeworkScenarioTeaching(tabHomework);
        else if (homeworkTab === "vocabulary") openHomeworkStudy(tabHomework);
        else if (homeworkTab === "practice") startHomeworkScenarioExercise(tabHomework);
        else return;
        state.homeworkIndex = scenarioPracticeIndex;
        state.homeworkSummary = scenarioPracticeSummary;
        state.homeworkRetryIds = scenarioPracticeRetryIds;
        render();
        var tabTarget = document.getElementById(
          homeworkTab === "teaching" ? "homework-teaching-title" :
          (homeworkTab === "vocabulary" ? "homework-study-table-title" :
          (state.homeworkSummary ? "homework-summary-title" : "homework-question-title"))
        );
        if (tabTarget) tabTarget.focus();
      }
      return;
    }
    if ((el = e.target.closest("[data-homework-type-open]"))) {
      var typeOpenedHomework = homeworkById(el.dataset.homeworkTypeOpen);
      if (VOCAB_DASHBOARD && typeOpenedHomework) {
        openHomework(typeOpenedHomework);
        jumpHomeworkType(typeOpenedHomework, el.dataset.homeworkType);
        render();
        var typeOpenedQuestion = document.getElementById("homework-question-title");
        if (typeOpenedQuestion) typeOpenedQuestion.focus();
      }
      return;
    }
    if ((el = e.target.closest("[data-homework-type]"))) {
      var typeHomework = homeworkById(state.homeworkId);
      if (VOCAB_DASHBOARD && typeHomework &&
          jumpHomeworkType(typeHomework, el.dataset.homeworkType)) {
        render();
        var typeQuestion = document.getElementById("homework-question-title");
        if (typeQuestion) typeQuestion.focus();
      }
      return;
    }
    if ((el = e.target.closest("[data-homework-open]"))) {
      var openedHomework = homeworkById(el.dataset.homeworkOpen);
      if (VOCAB_DASHBOARD && openedHomework) {
        openHomework(openedHomework);
        render();
        var homeworkQuestion = document.getElementById("homework-question-title");
        var homeworkSummary = document.getElementById("homework-summary-title");
        var homeworkScenario = document.getElementById("homework-scenario-title");
        if (homeworkQuestion) homeworkQuestion.focus();
        else if (homeworkSummary) homeworkSummary.focus();
        else if (homeworkScenario) homeworkScenario.focus();
      }
      return;
    }
    if ((el = e.target.closest("[data-homework-action]"))) {
      if (!VOCAB_DASHBOARD) return;
      var homeworkAction = el.dataset.homeworkAction;
      var currentHomework = homeworkById(state.homeworkId);
      if (currentHomework && homeworkAction === "start-teaching") {
        stopAll();
        openHomeworkScenarioTeaching(currentHomework);
      } else if (currentHomework && homeworkAction === "toggle-translations") {
        stopAll();
        state.homeworkDialogueTranslations = !state.homeworkDialogueTranslations;
      } else if (homeworkAction === "back") {
        stopAll();
        state.homeworkId = "";
        state.homeworkStudyOpen = false;
        state.homeworkStudyWordId = "";
        state.homeworkSentenceWordId = "";
        resetHomeworkStudyCard();
        state.homeworkIndex = 0;
        state.homeworkSummary = false;
        state.homeworkRetryIds = [];
        state.homeworkResetArmed = false;
        state.homeworkNotice = "";
        state.homeworkIssueNotice = "";
        state.homeworkScenarioIntro = false;
        state.homeworkScenarioTeaching = false;
        state.homeworkTeachingWordKey = "";
      } else if (currentHomework && homeworkAction === "start-exercise") {
        stopAll();
        startHomeworkScenarioExercise(currentHomework);
      } else if (currentHomework && homeworkAction === "previous") {
        var previousPosition = homeworkTypePosition(currentHomework);
        if (previousPosition.position > 0) {
          state.homeworkIndex = previousPosition.indices[previousPosition.position - 1];
        }
        state.homeworkSentenceWordId = "";
        state.homeworkResetArmed = false;
        state.homeworkNotice = "";
        state.homeworkIssueNotice = "";
        var previousEntries = homeworkActiveItems(currentHomework);
        var previousProgress = homeworkProgress(currentHomework);
        if (previousEntries[state.homeworkIndex]) {
          previousProgress.currentItemId = previousEntries[state.homeworkIndex].item.id;
          saveHomeworkProgress(currentHomework, previousProgress);
        }
      } else if (currentHomework && homeworkAction === "next") {
        var activeHomeworkItems = homeworkActiveItems(currentHomework);
        var currentEntry = activeHomeworkItems[state.homeworkIndex];
        var currentProgress = homeworkProgress(currentHomework);
        var currentResponse = currentEntry && currentProgress.responses[currentEntry.item.id];
        if (!currentResponse || !currentResponse.status) {
          state.homeworkNotice = "请先检查当前答案。";
        } else {
          var nextHomeworkTarget = homeworkNextTarget(currentHomework);
          if (nextHomeworkTarget.index < 0) {
          finishHomeworkSequence(currentHomework);
          } else {
            state.homeworkIndex = nextHomeworkTarget.index;
            state.homeworkSentenceWordId = "";
            currentProgress.currentItemId = activeHomeworkItems[state.homeworkIndex].item.id;
            saveHomeworkProgress(currentHomework, currentProgress);
            state.homeworkNotice = "";
            state.homeworkIssueNotice = "";
            state.homeworkResetArmed = false;
          }
        }
      } else if (currentHomework && homeworkAction === "retry") {
        retryHomeworkAnswers(currentHomework);
      } else if (currentHomework && homeworkAction === "browse") {
        state.homeworkSummary = false;
        state.homeworkRetryIds = [];
        state.homeworkIndex = 0;
        state.homeworkResetArmed = false;
        state.homeworkNotice = "";
        state.homeworkIssueNotice = "";
        state.homeworkSentenceWordId = "";
        state.homeworkScenarioIntro = false;
        state.homeworkScenarioTeaching = false;
        state.homeworkTeachingWordKey = "";
      } else if (currentHomework && homeworkAction === "issue") {
        reportHomeworkIssue();
        return;
      } else if (currentHomework && homeworkAction === "reset") {
        state.homeworkResetArmed = true;
      } else if (currentHomework && homeworkAction === "reset-cancel") {
        state.homeworkResetArmed = false;
      } else if (currentHomework && homeworkAction === "reset-confirm" &&
          el.dataset.homeworkId === currentHomework.id) {
        var resetSaved = deleteHomeworkProgress(currentHomework);
        state.homeworkId = resetSaved ? "" : currentHomework.id;
        state.homeworkIndex = 0;
        state.homeworkSummary = false;
        state.homeworkRetryIds = [];
        state.homeworkResetArmed = false;
        state.homeworkNotice = resetSaved ? "" : "暂时无法清除，请稍后重试。";
        state.homeworkIssueNotice = "";
        state.homeworkSentenceWordId = "";
        state.homeworkScenarioIntro = false;
        state.homeworkScenarioTeaching = false;
        state.homeworkTeachingWordKey = "";
      }
      render();
      var nextHomeworkInput = document.getElementById("homework-answer-input");
      var nextHomeworkTeaching = document.getElementById("homework-teaching-title");
      if (nextHomeworkInput && !nextHomeworkInput.value) nextHomeworkInput.focus();
      else if (nextHomeworkTeaching) nextHomeworkTeaching.focus();
      return;
    }
    if ((el = e.target.closest("[data-qa-delete]"))) {
      state.qaDeleteArmed = el.dataset.qaDelete;
      state.qaNotice = "";
      render();
      var cancelDelete = document.querySelector("[data-qa-cancel-delete]");
      if (cancelDelete) cancelDelete.focus();
      return;
    }
    if ((el = e.target.closest("[data-qa-cancel-delete]"))) {
      var armedId = state.qaDeleteArmed;
      state.qaDeleteArmed = null;
      render();
      var deleteButton = armedId ? document.querySelector('[data-qa-delete="' + CSS.escape(armedId) + '"]') : null;
      if (deleteButton) deleteButton.focus();
      return;
    }
    if ((el = e.target.closest("[data-qa-confirm-delete]"))) {
      var deleted = deleteQaQuestion(el.dataset.qaConfirmDelete);
      state.qaDeleteArmed = null;
      state.qaNotice = deleted ? learningStorageLabel(
        "已从 Q&A 清单移除；为保留学习审计，创建记录仍在本机历史中。",
        "已从 Q&A 清单移除；删除动作会同步，既有审计记录不会被改写。") :
        "暂时无法从这个浏览器中删除，请稍后重试。";
      render();
      var qaInputAfterDelete = document.getElementById("qa-question-input");
      if (qaInputAfterDelete) qaInputAfterDelete.focus();
      return;
    }
    if ((el = e.target.closest("[data-dashboard-nav]"))) {
      var dashboardNav = el.dataset.dashboardNav;
      if (dashboardNav !== "qa") state.qaDeleteArmed = null;
      if (dashboardNav === "today") {
        state.dashboardNav = "today";
        if (!state.reviewQueue.length) startReviewSession(false);
        render();
        var reviewTarget = document.getElementById("dashboard-review-card");
        if (reviewTarget) { reviewTarget.focus(); reviewTarget.scrollIntoView({ behavior: "smooth", block: "start" }); }
      } else if (dashboardNav === "all") {
        state.dashboardNav = "all";
        state.vocabFavoritesOnly = false;
        state.vocabCategory = "";
        render();
      } else if (dashboardNav === "favorites") {
        state.dashboardNav = "favorites";
        state.vocabFavoritesOnly = true;
        state.vocabCategory = "";
        render();
      } else if (dashboardNav === "qa") {
        state.dashboardNav = "qa";
        state.qaDeleteArmed = null;
        state.qaNotice = "";
        render();
        var qaTarget = document.getElementById("qa-question-input");
        if (qaTarget) qaTarget.focus();
      } else if (dashboardNav === "homework") {
        state.dashboardNav = "homework";
        state.homeworkResetArmed = false;
        state.homeworkNotice = "";
        state.homeworkIssueNotice = "";
        render();
        var homeworkTarget = document.getElementById("homework-page-title");
        if (homeworkTarget) homeworkTarget.focus();
      } else if (dashboardNav === "progress") {
        state.dashboardNav = "progress";
        render();
        var progressTarget = document.getElementById("history-page-title");
        if (progressTarget) progressTarget.focus();
      }
      return;
    }
    if ((el = e.target.closest("[data-learning-export]"))) {
      exportLearningData(el.dataset.learningExport);
      return;
    }
    if ((el = e.target.closest("[data-history-export]"))) {
      exportReviewHistory(el.dataset.historyExport);
      return;
    }
    if ((el = e.target.closest("[data-dashboard-action]"))) {
      state.dashboardNav = "today";
      if (!state.reviewQueue.length) startReviewSession(true);
      render();
      var cardTarget = document.getElementById("dashboard-review-card");
      if (cardTarget) { cardTarget.focus(); cardTarget.scrollIntoView({ behavior: "smooth", block: "start" }); }
      return;
    }
    if ((el = e.target.closest("[data-vocab-category]"))) {
      state.vocabCategory = el.dataset.vocabCategory || "";
      render();
      return;
    }
    if ((el = e.target.closest("[data-vocab-favorite]"))) {
      var favoriteWord = vocabWordByKey[el.dataset.vocabFavorite];
      if (favoriteWord) {
        refreshReviewStore(false);
        var favoriteKey = reviewCardKey(favoriteWord);
        var favoriteRec = reviewStore.cards[favoriteKey] || { level: 0, reviews: 0, lapses: 0 };
        favoriteRec.favorite = !favoriteRec.favorite;
        favoriteRec.favoriteUpdatedAt = Date.now();
        reviewStore.cards[favoriteKey] = favoriteRec;
        reviewStore.updatedAt = Date.now();
        saveReviewRoot();
        render();
      }
      return;
    }
    if ((el = e.target.closest(".mode-tab"))) {
      var nextView = el.dataset.view === "review" ? "review" : "read";
      if (nextView === "review" && state.view !== "review") startReviewSession(false);
      state.view = nextView;
      render();
      return;
    }
    if ((el = e.target.closest("[data-review-action]"))) {
      var reviewAction = el.dataset.reviewAction;
      if (reviewAction === "reveal") {
        revealReviewAnswer("skipped", "manual_button");
        render();
      } else if (reviewAction === "speak") {
        speakReviewWord();
      } else if (reviewAction === "again" && state.reviewRevealed) {
        rateReview("again", "button");
      } else if (reviewAction === "issue" && state.reviewRevealed) {
        reportReviewIssue();
      } else if (reviewAction === "known" && state.reviewRevealed) {
        rateReview("known", "button");
      } else if (reviewAction === "continue") {
        startReviewSession(true);
        render();
      }
      return;
    }
    if ((el = e.target.closest(".langsw button"))) {
      state.lang = el.dataset.lang;
      try { localStorage.setItem(LS_KEY, state.lang); } catch (err) {}
      render();
      return;
    }
    if ((el = e.target.closest("#speed-toggle"))) {
      state.slow = !state.slow;
      el.setAttribute("aria-pressed", String(state.slow));
      player.playbackRate = state.slow ? 0.65 : 1.0;
      return;
    }
    if ((el = e.target.closest(".say"))) {
      var sent = el.closest(".sent");
      if (speaking && currentSent === sent && !queue.length) { stopAll(); return; }
      stopAll();
      speakSent(sent, null);
      return;
    }
    if ((el = e.target.closest(".playall"))) {
      if (queue.length || speaking) { stopAll(); return; }
      var section = el.closest(".lesson");
      playQueue(Array.prototype.slice.call(section.querySelectorAll(".sent")), el);
      return;
    }
    if ((el = e.target.closest(".w"))) {
      showPop(el, +el.dataset.si, el.dataset.key);
      return;
    }
    if ((el = e.target.closest(".chip"))) {
      showPop(el, -1, el.dataset.key);
      return;
    }
    if (!e.target.closest(".pop")) hidePop();
  });

  document.addEventListener("submit", function (e) {
    if (!e.target) return;
    if (e.target.id === "homework-study-answer-form") {
      e.preventDefault();
      var homeworkStudyInput = document.getElementById("homework-study-answer-input");
      var homeworkStudyAnswer = homeworkStudyInput ? homeworkStudyInput.value.trim() : "";
      state.homeworkStudyAnswer = homeworkStudyAnswer;
      if (!homeworkStudyAnswer) {
        state.homeworkStudyNotice = "请先填写中文或英文意思。";
        if (homeworkStudyInput) {
          homeworkStudyInput.setAttribute("aria-invalid", "true");
          homeworkStudyInput.focus();
        }
        return;
      }
      recordHomeworkStudyResult("typed");
      render();
      var homeworkStudyResult = document.querySelector(".homework-study-result");
      if (homeworkStudyResult) homeworkStudyResult.scrollIntoView({ behavior: "smooth", block: "nearest" });
      return;
    }
    if (e.target.id === "homework-answer-form") {
      e.preventDefault();
      var homeworkTextInput = document.getElementById("homework-answer-input");
      var homeworkChoiceInput = e.target.querySelector('input[name="homework-answer"]:checked');
      var homeworkAnswer = homeworkTextInput ? homeworkTextInput.value.trim() :
        (homeworkChoiceInput ? homeworkChoiceInput.value : "");
      if (!homeworkAnswer) {
        state.homeworkNotice = "请先选择或填写答案。";
        if (homeworkTextInput) {
          homeworkTextInput.setAttribute("aria-invalid", "true");
          homeworkTextInput.focus();
        }
        render();
        return;
      }
      if (state.homeworkScoringItemId) return;
      checkHomeworkAnswerEnhanced(homeworkAnswer).then(function () {
        render();
        var homeworkFeedback = document.querySelector(".homework-feedback");
        if (homeworkFeedback) {
          homeworkFeedback.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      });
      return;
    }
    if (e.target.id === "qa-note-form") {
      e.preventDefault();
      var qaInput = document.getElementById("qa-question-input");
      var question = qaInput ? qaInput.value.trim() : "";
      if (!question) {
        if (qaInput) {
          qaInput.setAttribute("aria-invalid", "true");
          qaInput.focus();
        }
        return;
      }
      state.qaDraft = qaInput.value;
      if (addQaQuestion(question)) {
        state.qaDraft = "";
        state.qaNotice = "问题已保存。";
      } else {
        state.qaNotice = "暂时无法保存在这个浏览器中，请复制问题后重试。";
      }
      render();
      var qaInputAfterSave = document.getElementById("qa-question-input");
      if (qaInputAfterSave) qaInputAfterSave.focus();
      return;
    }
    if (e.target.id !== "review-answer-form") return;
    e.preventDefault();
    if (!VOCAB_DASHBOARD || state.reviewRevealed || !state.reviewQueue.length) return;
    var input = document.getElementById("review-answer-input");
    var submitted = input ? input.value.trim() : "";
    if (!submitted) {
      if (input) {
        input.setAttribute("aria-invalid", "true");
        input.focus();
      }
      return;
    }
    state.reviewAnswer = submitted;
    state.reviewAnswerCorrect = reviewAnswerMatches(state.reviewQueue[0], submitted);
    revealReviewAnswer("typed", "typed_submit");
    render();
  });

  document.addEventListener("input", function (e) {
    if (!VOCAB_DASHBOARD || !e.target) return;
    if (e.target.id === "homework-study-answer-input") {
      state.homeworkStudyAnswer = e.target.value;
      e.target.removeAttribute("aria-invalid");
      var homeworkStudyCheck = document.querySelector("#homework-study-answer-form button[type=submit]");
      if (homeworkStudyCheck) homeworkStudyCheck.disabled = !e.target.value.trim();
      if (state.homeworkStudyNotice) {
        state.homeworkStudyNotice = "";
        var homeworkStudyNotice = document.querySelector(".homework-study-card .qa-notice");
        if (homeworkStudyNotice) homeworkStudyNotice.textContent = "";
      }
      return;
    }
    if (e.target.id === "homework-study-search") {
      state.homeworkStudySearch = e.target.value;
      updateHomeworkStudyList();
      return;
    }
    if (e.target.id === "homework-answer-input" ||
        (e.target.name === "homework-answer" && e.target.type === "radio")) {
      e.target.removeAttribute("aria-invalid");
      var answerValue = e.target.type === "radio" ? (e.target.checked ? e.target.value : "") : e.target.value;
      if (!answerValue && e.target.type === "radio") return;
      var homeworkSaveResult = saveHomeworkAnswer(answerValue);
      var homeworkCheckButton = document.querySelector("#homework-answer-form button[type=submit]");
      if (homeworkCheckButton) homeworkCheckButton.disabled = !String(answerValue).trim();
      var homeworkNotice = document.querySelector(".homework-sheet .qa-notice");
      if (homeworkNotice) homeworkNotice.textContent = state.homeworkNotice;
      if (homeworkSaveResult.cleared) {
        var restoreTextFocus = e.target.id === "homework-answer-input";
        render();
        var restoredHomeworkInput = document.getElementById("homework-answer-input");
        if (restoreTextFocus && restoredHomeworkInput) {
          restoredHomeworkInput.focus();
          restoredHomeworkInput.setSelectionRange(restoredHomeworkInput.value.length, restoredHomeworkInput.value.length);
        }
      }
      return;
    }
    if (e.target.id === "qa-question-input") {
      state.qaDraft = e.target.value;
      e.target.removeAttribute("aria-invalid");
      var qaCount = document.getElementById("qa-character-count");
      if (qaCount) qaCount.textContent = e.target.value.length + " / " + QA_MAX_LENGTH;
      var qaSave = document.getElementById("qa-save-button");
      if (qaSave) qaSave.disabled = !e.target.value.trim();
      if (state.qaNotice) {
        state.qaNotice = "";
        var qaNotice = document.getElementById("qa-notice");
        if (qaNotice) qaNotice.textContent = "";
      }
      return;
    }
    if (e.target.id === "review-answer-input") {
      state.reviewAnswer = e.target.value;
      e.target.removeAttribute("aria-invalid");
      return;
    }
    if (e.target.id === "vocab-search") {
      state.vocabSearch = e.target.value;
      updateDashboardVocabList();
    }
  });

  document.addEventListener("change", function (e) {
    if (!VOCAB_DASHBOARD || !e.target) return;
    if (e.target.id === "homework-study-filter") {
      state.homeworkStudyRole = ["answer", "context"].indexOf(e.target.value) !== -1 ? e.target.value : "all";
      updateHomeworkStudyList();
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      hidePop();
      if (state.dashboardNav === "qa" && state.qaDeleteArmed) {
        state.qaDeleteArmed = null;
        render();
        return;
      }
    }
    var a = document.activeElement;
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && a && a.id === "qa-question-input") {
      e.preventDefault();
      if (a.form && typeof a.form.requestSubmit === "function") a.form.requestSubmit();
      return;
    }
    var reviewSurfaceVisible = !VOCAB_DASHBOARD || !!document.getElementById("dashboard-review-card");
    if (reviewSurfaceVisible && (state.view === "review" || state.view === "vocab") && !e.metaKey && !e.ctrlKey && !e.altKey) {
      var interactive = a && /^(BUTTON|A|INPUT|TEXTAREA|SELECT)$/.test(a.tagName || "");
      if (!state.reviewRevealed && (e.key === " " || e.key === "Enter") && !interactive && state.reviewQueue.length) {
        e.preventDefault();
        revealReviewAnswer("skipped", "manual_keyboard");
        render();
        return;
      }
      if (state.reviewRevealed && e.key === "1") { e.preventDefault(); rateReview("again", "keyboard"); return; }
      if (state.reviewRevealed && VOCAB_DASHBOARD && e.key === "2") { e.preventDefault(); reportReviewIssue(); return; }
      if (state.reviewRevealed && ((VOCAB_DASHBOARD && e.key === "3") || (!VOCAB_DASHBOARD && e.key === "2"))) {
        e.preventDefault(); rateReview("known", "keyboard"); return;
      }
    }
    if ((e.key === "Enter" || e.key === " ") && a && a.classList && a.classList.contains("w")) {
      e.preventDefault();
      showPop(a, +a.dataset.si, a.dataset.key);
    }
  });
  window.addEventListener("scroll", hidePop, { passive: true });
  window.addEventListener("resize", hidePop);

  if (state.view === "review" || state.view === "vocab") startReviewSession(false);
  render();
})();
</script>
