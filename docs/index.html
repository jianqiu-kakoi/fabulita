    --bg: #F6F4EE; --card: #FFFFFF; --ink: #2A2620; --muted: #6F695E;
    --accent: #2F5DA8; --accent-deep: #24497F; --accent-soft: rgba(47,93,168,0.09);
    --gold: #B8860B; --line: #E4DFD4; --danger: #A3352B; --ok: #3A7D44;
    --underline: rgba(47,93,168,0.45);
    --pop-bg: #262A33; --pop-ink: #F2F0E9; --pop-muted: #A8B0BE;

  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1A1C21; --card: #22252C; --ink: #E7E3D9; --muted: #9A948A;

      --gold: #D5A54E; --line: #33363E; --danger: #E08A80; --ok: #7CBF87;
      --underline: rgba(138,176,232,0.5);
      --pop-bg: #F2F0E9; --pop-ink: #262A33; --pop-muted: #5C6470; }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); margin: 0; padding: 2.5rem 1.25rem 4rem; line-height: 1.7; }
  .wrap { max-width: 44rem; margin: 0 auto; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  .eyebrow { font-size: 0.78rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin: 0; }
  .langsw { display: flex; gap: 0.35rem; }
  .langsw button { font-family: var(--sans); font-size: 0.78rem; padding: 0.25rem 0.7rem; border: 1px solid var(--line); border-radius: 100px; background: var(--card); color: var(--muted); cursor: pointer; }
  .langsw button:hover { border-color: var(--accent); color: var(--accent-deep); }
  .langsw button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--card); }
  h1 { font-family: var(--serif); font-size: 2.3rem; font-weight: 600; margin: 1.2rem 0 0.6rem; text-wrap: balance; }
  .sub { color: var(--muted); font-size: 1rem; margin: 0 0 2.2rem; max-width: 38rem; }
  h2 { font-family: var(--serif); font-size: 1.2rem; font-weight: 600; margin: 0 0 1rem; }
  .books { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  a.book { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1.5rem 1.5rem 1.2rem; text-decoration: none; color: var(--ink); transition: border-color 120ms ease, transform 120ms ease; }
  a.book:hover { border-color: var(--accent); transform: translateY(-2px); }
  a.book .bname { font-family: var(--serif); font-size: 1.6rem; font-weight: 600; color: var(--accent-deep); display: block; margin-bottom: 0.3rem; }
  a.book .bmeta { font-size: 0.82rem; color: var(--muted); display: block; }
  a.book .bopen { font-size: 0.82rem; color: var(--gold); display: block; margin-top: 0.7rem; }

  .widget { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1.4rem 1.5rem; margin-bottom: 1.2rem; }
  .w-head { display: flex; align-items: center; gap: 0.9rem; cursor: pointer; }
  .w-plus { font-family: var(--serif); background: var(--accent); color: var(--card); min-width: 2.1rem; height: 2.1rem; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 1.3rem; flex-shrink: 0; }
  .w-head h2 { margin: 0; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .w-head .muted { margin: 0; }
  .w-body { display: none; margin-top: 1.1rem; border-top: 1px solid var(--line); padding-top: 1.1rem; }
  .widget.open .w-body { display: block; }
  label { display: block; font-size: 0.82rem; color: var(--muted); margin: 0.7rem 0 0.2rem; }
  select, textarea, input[type=password], input[type=text] { width: 100%; font-family: var(--sans); font-size: 0.95rem; padding: 0.5rem 0.7rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem; min-height: 8rem; resize: vertical; }
  select { width: auto; }
  input[type=password], input[type=text].gfield { width: 100%; max-width: 24rem; font-family: ui-monospace, monospace; font-size: 0.8rem; }
  .row { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin-top: 0.9rem; }
  .btn { font-family: var(--sans); font-size: 0.85rem; padding: 0.4rem 0.95rem; border: 1px solid var(--line); border-radius: 100px; background: var(--card); color: var(--ink); cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
  .btn-primary:hover { background: var(--accent-deep); }
  .btn-ok { border-color: var(--ok); color: var(--ok); }
  .btn-danger { color: var(--danger); }

  .tabs { display: flex; gap: 0.4rem; margin-bottom: 0.8rem; }
  .tab { font-family: var(--sans); font-size: 0.85rem; padding: 0.4rem 0.95rem; border: 1px solid var(--line); border-radius: 100px; background: var(--card); color: var(--ink); cursor: pointer; }
  .tab:hover { border-color: var(--accent); }
  .tab.on { background: var(--accent); border-color: var(--accent); color: var(--card); }

  .vtable { width: 100%; border-collapse: collapse; margin-top: 0.9rem; font-size: 0.92rem; }
  .vtable td { padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--line); }
  .vtable td.vw { font-family: var(--serif); font-size: 1.02rem; color: var(--accent-deep); white-space: nowrap; }
  .vtable td.varrow { color: var(--muted); }
  .vtable td.vdel { text-align: right; }
  .vtable button { border: none; background: none; color: var(--danger); cursor: pointer; font-size: 0.95rem; padding: 0.1rem 0.35rem; border-radius: 4px; }
  .vtable button:hover { background: var(--accent-soft); }
  .vscroll { max-height: 24rem; overflow-y: auto; scrollbar-width: thin; border: 1px solid var(--line); border-radius: 8px; margin-top: 0.9rem; padding: 0 0.4rem; }
  .vscroll::-webkit-scrollbar { width: 8px; }
  .vscroll::-webkit-scrollbar-thumb { background: var(--underline); border-radius: 4px; }
  .vscroll .vtable { margin-top: 0; }

  .cov-bar { height: 6px; background: var(--accent-soft); border-radius: 3px; margin: 0.6rem 0 0.4rem; overflow: hidden; }
  .cov-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 300ms ease; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.5rem; }
  .chip { font-family: var(--serif); font-size: 0.85rem; padding: 0.03rem 0.5rem; border: 1px dashed var(--underline); border-radius: 100px; color: var(--accent-deep); }
  .chip[data-act] { cursor: pointer; }
  .chip-sel { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip-cov { opacity: 0.45; text-decoration: line-through; }
  .upbatch { margin: 0.4rem 0 0; }
  .upbatch summary { cursor: pointer; font-size: 0.85rem; }

  .msg { border-radius: 8px; padding: 0.6rem 0.9rem; font-size: 0.86rem; margin-top: 0.8rem; }
  .msg.ok { background: var(--accent-soft); }
  .msg.err { border: 1px solid var(--danger); color: var(--danger); }
  .msg.warn { border: 1px solid var(--gold); color: var(--gold); }

  .spinner { display: inline-block; width: 1em; height: 1em; border: 2px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -0.15em; margin-right: 0.4rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }

  .prev { border: 1px solid var(--line); border-radius: 10px; padding: 1.1rem 1.2rem; margin-top: 1rem; }
  .prev h3 { font-family: var(--serif); font-size: 1.15rem; margin: 0 0 0.2rem; }
  .prev .sub2 { color: var(--muted); font-size: 0.82rem; margin: 0 0 0.8rem; }
  .prev .es { font-family: var(--serif); font-size: 1.18rem; line-height: 2; margin: 0 0 0.15rem; }
  .prev .trans { font-size: 0.83rem; color: var(--muted); margin: 0 0 0.7rem; }
  .w { cursor: pointer; border-bottom: 1px dashed var(--underline); padding-bottom: 1px; }
  .w:hover { background: var(--accent-soft); }
  .say { display: inline-flex; align-items: center; justify-content: center; width: 1.35rem; height: 1.35rem; margin: 0 0.3rem; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--accent); cursor: pointer; vertical-align: baseline; transform: translateY(0.15em); }
  .say:hover { background: var(--accent-soft); border-color: var(--accent); }
  .say svg { width: 0.72rem; height: 0.72rem; display: block; }

  .pop { position: absolute; z-index: 10; background: var(--pop-bg); color: var(--pop-ink); border-radius: 8px; padding: 0.55rem 0.8rem; max-width: 15rem; box-shadow: 0 6px 24px rgba(0,0,0,0.22); font-size: 0.88rem; line-height: 1.5; display: none; }
  .pop.show { display: block; }
  .pop .pw { font-family: var(--serif); font-weight: 600; display: block; }
  .pop .pn { display: block; color: var(--pop-muted); font-size: 0.78rem; margin-top: 0.15rem; }

  details.keyrow { margin-top: 1rem; border-top: 1px dashed var(--line); padding-top: 0.6rem; }
  details.keyrow summary { cursor: pointer; font-size: 0.8rem; color: var(--muted); list-style: none; }
  details.keyrow summary::-webkit-details-marker { display: none; }
  details.keyrow summary:hover { color: var(--accent-deep); }

  .plist { display: grid; gap: 0.7rem; margin: 0.8rem 0 1rem; }
  .lrow { display: flex; justify-content: space-between; align-items: center; gap: 1rem; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0.8rem 1.2rem; cursor: pointer; }
  .lrow:hover { border-color: var(--accent); }
  .lrow .pname { font-family: var(--serif); font-weight: 600; }

  footer { color: var(--muted); font-size: 0.8rem; margin-top: 3rem; display: flex; gap: 1.2rem; flex-wrap: wrap; }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--accent-deep); }
  input[type=file] { display: none; }
</style>

var pdfjsPromise = null;
function loadPdfjs() {
  if (!pdfjsPromise) {
    pdfjsPromise = import(PDFJS_URL).then(function (m) {
      m.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
      return m;
    });
    pdfjsPromise.catch(function () { pdfjsPromise = null; });
  }
  return pdfjsPromise;
}
function extractPdfText(file) {
  return loadPdfjs().catch(function () { throw new Error(t("errPdfLoad")); })
    .then(function (lib) {
      return file.arrayBuffer().then(function (buf) {
        return lib.getDocument({ data: buf }).promise;
      });
    }).then(function (doc) {
      var chain = Promise.resolve([]);
      for (var i = 1; i <= doc.numPages; i++) {
        (function (n) {
          chain = chain.then(function (acc) {
            return doc.getPage(n).then(function (pg) { return pg.getTextContent(); }).then(function (tc) {
              var lines = [], line = [], lastY = null;
              tc.items.forEach(function (it) {
                var y = it.transform ? it.transform[5] : null;
                if (line.length && lastY !== null && y !== null && Math.abs(y - lastY) > 2) {
                  lines.push(line.join(" "));
                  line = [];
                }
                if (it.str && it.str.trim()) line.push(it.str.trim());
                if (it.hasEOL && line.length) {
                  lines.push(line.join(" "));
                  line = [];
                }
                if (y !== null) lastY = y;
              });
              if (line.length) lines.push(line.join(" "));
              acc.push(lines.join("\n"));
              return acc;
            });
          });
        })(i);
      }
      return chain.then(function (acc) { return acc.join("\n"); });
    });
}

function parseVocab(text) {
  var entries = [], skipped = 0, seen = {};
  text.split(/\r?\n/).forEach(function (line) {
    line = line.trim();
    if (!line) return;
    var cells = null;
    if (line.indexOf("\t") !== -1) cells = line.split("\t");
    else if (/→|->/.test(line)) cells = line.split(/→|->/);
    else if (line.indexOf(",") !== -1 || line.indexOf("，") !== -1) cells = line.split(/[,，]/);
    else if (line.indexOf("：") !== -1 || /:(?!\/)/.test(line)) cells = line.split(/[：:]/);
    else if (/\s{2,}/.test(line)) cells = line.split(/\s{2,}/);
    else if (/\s/.test(line)) cells = [line.slice(0, line.search(/\s/)), line.slice(line.search(/\s/))];
    if (!cells) { skipped++; return; }
    cells = cells.map(function (c) { return c.trim(); }).filter(Boolean);
    if (cells.length < 2) { skipped++; return; }
    var w = cells[0];
    if (/^(word|palabra|词|単語)$/i.test(w)) return;
    var meanings = [];
    cells.slice(1).forEach(function (c) {
      c.split(/[;；]/).forEach(function (m) { m = m.trim(); if (m) meanings.push(m); });
    });
    var joiner = meanings.some(function (m) { return /[　-鿿぀-ヿ]/.test(m); }) ? "；" : "; ";
    var key = norm(w);
    if (seen[key]) { skipped++; return; }
    seen[key] = true;
    entries.push({ w: w, gloss: meanings.join(joiner) });
  });
  return { entries: entries, skipped: skipped };
}

function normalizeVocabList(raw) {
  var list = raw && (Array.isArray(raw) ? raw : raw.words);
  if (!Array.isArray(list)) throw new Error("no words[] in model output");
  var entries = [], seen = {};
  list.forEach(function (e) {
    if (!e || typeof e.w !== "string" || typeof e.gloss !== "string") return;
    var w = e.w.trim(), gloss = e.gloss.trim();
    if (!w || !gloss) return;
    var k = norm(w);
    if (seen[k]) return;
    seen[k] = true;
    entries.push({ w: w, gloss: gloss });
  });
  return entries;
}

function expCell(s) { return String(s).replace(/[\t\n]+/g, " "); }

function vocabTsv(list) { return list.map(function (v) { return expCell(v.w) + "\t" + expCell(v.gloss); }).join("\n"); }

function langCovered(lang) {
  var covd = {}, all = loadAll();
  Object.keys(all).forEach(function (id) {
    var p = all[id];
    if (!p || !p.config || p.config.lang !== lang) return;
    (p.stories || []).forEach(function (s) {
      (s && s.vocab_used || []).forEach(function (w) { covd[norm(w)] = true; });
    });
  });
  return covd;
}
function listsOf(lang) {
  var all = loadAll(), out = [];
  Object.keys(all).forEach(function (id) {
    var p = all[id];
    if (!p || !p.config) return;
    if (!lang || p.config.lang === lang) out.push(p);
  });
  out.sort(function (a, b) { return a.config.name < b.config.name ? -1 : 1; });
  return out;
}
function genLists() {
  var all = loadAll(), out = [];
  (state.genSel || []).forEach(function (id) { if (all[id]) out.push(all[id]); });
  return out;
}
function genUnion(lists) {
  var seen = {}, out = [];
  lists.forEach(function (p) {
    (p.vocab || []).forEach(function (v) {
      var k = norm(v.w);
      if (!seen[k]) { seen[k] = true; out.push(v); }
    });
  });
  return out;
}
function genBatch() {
  var lists = genLists();
  if (!lists.length) return [];
  var union = genUnion(lists);
  var src = state.genSrc || { type: "all" };
  if (src.type === "manual") {
    var sel = {};
    (src.words || []).forEach(function (w) { sel[w] = true; });
    return union.filter(function (v) { return sel[norm(v.w)]; }).slice(0, 20);
  }
  var covd = langCovered(lists[0].config.lang);
  var un = union.filter(function (v) { return !covd[norm(v.w)]; });
  return un.slice(0, src.type === "llm" ? 120 : 20);
}

function useClause(n) {
  var lo = Math.min(10, n), hi = Math.min(20, n);
  return lo >= hi ? "all " + hi : "at least " + lo + " and at most " + hi;

function promptFor(p, batch, attempt, pickMode) {
  var list = batch.map(function (v) { return "- " + v.w + " — " + v.gloss; }).join("\n");
  var vary = attempt > 0 ? "\n- Write a COMPLETELY DIFFERENT story from any previous attempt: new scene, new characters, new situation." : "";
  var useLine = pickMode
    ? "From the vocabulary list below, CHOOSE 10 to 20 words that naturally belong\ntogether in ONE coherent everyday scene - prefer words that combine well and\nare easy to weave into the same short story. Then write the story using your\nchosen words (you may ignore the rest of the list):"
    : "Write ONE short story (5-8 short sentences, simple present tense, one scene,\nconcrete everyday situation). You MUST use " + useClause(batch.length) + "\nof these vocabulary words (their glosses are in " + (GLOSS_NAMES[p.config.gloss_lang] || p.config.gloss_lang) + "):";
  if (pickMode) useLine = "Write ONE short story (5-8 short sentences, simple present tense, one scene,\nconcrete everyday situation). " + useLine;
  return "You are writing a graded-reader micro-story for a beginner (CEFR A1) learner of " + (LANG_NAMES[p.config.lang] || p.config.lang) + ".\n\n" +
    useLine + "\n\n" + list +
    "\n\nRules:\n- Only A1-level grammar and high-frequency function words besides the list above.\n- Natural, coherent story — not a word-salad that name-drops vocabulary." + vary +
    "\n- Glosses and translations must be written in " + (GLOSS_NAMES[p.config.gloss_lang] || p.config.gloss_lang) + ".\n- \"glossary\" must cover EVERY word form that appears in the text and is not a proper name — including inflected verb forms (gloss them back to the dictionary form).\n- \"vocab_used\" lists exactly the words from the vocabulary list above that appear in the story (dictionary form as given in the list).\n\nReturn ONLY a JSON object in this exact shape (no markdown fence, no commentary):\n\n" +
    JSON.stringify({ id: "kebab-case-slug", title: "Story title in the target language", title_note: "title translated",
      sentences: [{ text: "First sentence.", trans: "translation" }],
      vocab_used: ["word1"], glossary: { "word-form": ["gloss", "note e.g. ← infinitive"] }, grammar: [["pattern", "explanation"]] }, null, 2);
}

// story schema for the API's structured output (glossary/grammar as arrays; normalized after)
var API_SCHEMA = {
  type: "object", additionalProperties: false,
  required: ["id", "title", "title_note", "sentences", "vocab_used", "glossary", "grammar"],
  properties: {
    id: { type: "string" }, title: { type: "string" }, title_note: { type: "string" },
    sentences: { type: "array", items: { type: "object", additionalProperties: false, required: ["text", "trans"], properties: { text: { type: "string" }, trans: { type: "string" } } } },
    vocab_used: { type: "array", items: { type: "string" } },
    glossary: { type: "array", items: { type: "object", additionalProperties: false, required: ["word", "gloss"], properties: { word: { type: "string" }, gloss: { type: "string" }, note: { type: "string" } } } },
    grammar: { type: "array", items: { type: "object", additionalProperties: false, required: ["pattern", "note"], properties: { pattern: { type: "string" }, note: { type: "string" } } } }
  }
};

// accept both wire shapes (API arrays / manual-paste object+pairs)
function normalizeStory(raw, p) {
  var s = {
    id: String(raw.id || "story").toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "") || "story",
    title: raw.title || "?", title_note: raw.title_note || "",
    sentences: (raw.sentences || []).filter(function (x) { return x && x.text; })
      .map(function (x) { return { text: x.text, trans: x.trans || "" }; }),
    vocab_used: raw.vocab_used || [], glossary: {}, grammar: [], status: "accepted"
  };
  if (Array.isArray(raw.glossary)) {
    raw.glossary.forEach(function (g) { if (g && g.word) s.glossary[g.word] = g.note ? [g.gloss, g.note] : [g.gloss]; });
  } else if (raw.glossary && typeof raw.glossary === "object") {
    Object.keys(raw.glossary).forEach(function (k) {
      var v = raw.glossary[k];
      s.glossary[k] = Array.isArray(v) ? v : [String(v)];
    });
  }
  (raw.grammar || []).forEach(function (g) {
    if (Array.isArray(g) && g.length >= 2) s.grammar.push([g[0], g[1]]);
    else if (g && g.pattern) s.grammar.push([g.pattern, g.note || ""]);
  });
  var ids = {};
  p.stories.forEach(function (x) { ids[x.id] = true; });
  var base = s.id, n = 2;
  while (ids[s.id]) { s.id = base + "-" + n; n++; }
  return s;
}

function validateStory(p, s) {
  var warnings = [], missing = [];
  if (!s.sentences.length) warnings.push("no sentences");
  var fulltext = norm(s.sentences.map(function (x) { return x.text; }).join(" "));
  var tokens = {};
  (fulltext.match(/\p{L}+/gu) || []).forEach(function (w) { tokens[w] = true; });
  s.vocab_used.forEach(function (w) {
    var k = norm(w), hit = tokens[k];
    if (!hit && k.length >= 4) {
      var stem = k.slice(0, -1);
      hit = Object.keys(tokens).some(function (tk) { return tk.indexOf(stem) === 0; });
    }
    if (!hit) hit = fulltext.indexOf(k) !== -1;
    if (!hit) { warnings.push("vocab_used '" + w + "' not found in the text"); missing.push(w); }
  });
  return { warnings: warnings, missing: missing };
}

function httpError(res) {
  if (res.status === 401 || res.status === 403) throw new Error(t("errKey"));
  if (res.status === 429) throw new Error(t("errRate"));
  return res.json().then(function (e) {
    throw new Error((e.error && (e.error.message || e.error)) || ("HTTP " + res.status));
  }, function () { throw new Error("HTTP " + res.status); });
}

function parseStoryText(text) {
  text = text.replace(/<think>[\s\S]*?<\/think>/gi, "").trim();
  var a = text.indexOf("{"), b = text.lastIndexOf("}");
  if (a === -1 || b < a) throw new Error("no JSON in model output");
  return JSON.parse(text.slice(a, b + 1));
}

function generateAnthropic(g, prompt, schema) {
  return fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": g.key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: g.model || "claude-opus-4-8",
      max_tokens: 8192,
      output_config: { format: { type: "json_schema", schema: schema || API_SCHEMA } },
      messages: [{ role: "user", content: prompt }]
    })
  }).then(function (res) {
    if (!res.ok) return httpError(res);
    return res.json();
  }).then(function (data) {
    if (data.stop_reason === "refusal") throw new Error("refused — try again");
    var text = "";
    (data.content || []).forEach(function (b) { if (b.type === "text") text += b.text; });
    return JSON.parse(text);
  });
}

function openaiChat(g, prompt, timeoutMs) {
  var tmo = timeoutMs || 180000;
  var base = (g.base || (PROV[g.provider] && PROV[g.provider].base) || "").replace(/\/+$/, "");
  var headers = { "content-type": "application/json" };
  if (g.key) headers["Authorization"] = "Bearer " + g.key;
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, tmo);
  return fetch(base + "/chat/completions", {
    method: "POST", headers: headers, signal: ctrl.signal,
    body: JSON.stringify({
      model: g.model, stream: false,
      response_format: { type: "json_object" },
      messages: [{ role: "user", content: prompt }]
    })
  }).catch(function (err) {
    if (err && err.name === "AbortError") throw new Error("timeout (" + Math.round(tmo / 1000) + " s)");
    throw new Error(t("errConn") + base);
  }).then(function (res) {
    clearTimeout(timer);
    if (!res.ok) return httpError(res);
    return res.json();
  }).then(function (data) {
    var msg = data.choices && data.choices[0] && data.choices[0].message;
    return (msg && msg.content) || "";
  });
}

function generateOpenAI(g, prompt) {
  return openaiChat(g, prompt, 600000).then(parseStoryText);
}

function generateStory(p, batch, attempt) {
  var g = genCfg();
  var prompt = promptFor(p, batch, attempt, state.genSrc.type === "llm");
  if (g.provider === "anthropic") return generateAnthropic(g, prompt);
  if (/^qwen3\b/i.test(g.model || "")) prompt += "\n\n/no_think";
  return generateOpenAI(g, prompt);
}

// ───────────────────────── actions ─────────────────────────
function doParse(text) {
  state.lastRaw = text;
  state.upNameBuf = null;
  var r = parseVocab(text);
  if (!r.entries.length) { state.skipped = -1; state.pending = null; }
  else { state.step = "confirm"; state.pending = r.entries; state.skipped = r.skipped; }
  render();
}

function runAiParse(getText) {
  if (!genReady()) { state.aiErr = t("aiNeedProvider"); state.keyOpen = true; render(); return; }
  state.aiBusy = true; state.aiErr = null; state.step = "input"; render();
  Promise.resolve().then(getText).then(function (text) {
    text = String(text || "");
    if (!text.replace(/\s/g, "")) throw new Error(t("errPdfScan"));
    state.lastRaw = text;
    return llmParseVocab(text);
  }).then(function (entries) {
    state.aiBusy = false;
    state.upNameBuf = null;
    if (!entries.length) { state.skipped = -1; state.pending = null; }
    else { state.step = "confirm"; state.pending = entries; state.skipped = 0; }
    render();
  }, function (err) {
    state.aiBusy = false; state.aiErr = t("errAiParse") + err.message; render();
  });
}

function requireGenLists() {
  if (genLists().length) return true;
  state.loop.error = t("selListFirst");
  render();
  return false;
}

function startGenerate() {
  var lists = genLists();
  var lp = state.loop;
  if (!lists.length) { lp.phase = "idle"; render(); return; }
  var p = lists[0], batch = genBatch();
  if (!batch.length) { lp.phase = "idle"; render(); return; }
  lp.runId = (lp.runId || 0) + 1;
  lp.targetId = p.id;
  var run = lp.runId;
  lp.phase = "generating"; lp.error = null; state.msg = null;
  render();
  generateStory(p, batch, lp.attempt).then(function (raw) {
    if (run !== lp.runId) return;
    var s = normalizeStory(raw, p);
    lp.story = s;
    var v = validateStory(p, s);
    lp.warnings = v.warnings; lp.missing = v.missing;
    lp.phase = "preview";
    saveDraft();
    render();
  }, function (err) {
    if (run !== lp.runId) return;
    lp.phase = "idle";
    lp.error = t("errApi") + err.message;
    render();
  });
}

document.addEventListener("click", function (e) {
  var lb = e.target.closest(".langsw button");
  if (lb) { state.lang = lb.dataset.lang; try { localStorage.setItem(LSL, state.lang); } catch (err) {} render(); return; }

  var say = e.target.closest(".say");
  if (say) {
    var gLists0 = genLists(), s0 = state.loop.story;
    if (gLists0.length && s0) speak(s0.sentences[+say.dataset.i].text, gLists0[0].config.lang);
    return;
  }
  var w = e.target.closest(".w");
  if (w) {
    var gLists1 = genLists(), s1 = state.loop.story;
    if (gLists1.length && s1) {
      var entry = glossMap(genUnion(gLists1), gLists1[0].glossary, s1)[w.dataset.key];
      if (entry) { showPop(w, entry); e.stopPropagation(); return; }
    }
  }

  var el = e.target.closest("[data-act]");
  if (!el) { if (!e.target.closest(".pop")) hidePop(); return; }
  var act = el.dataset.act, lp = state.loop;

  if (act === "toggle") { state.open = !state.open; render(); }
  else if (act === "toggle-books") { state.booksOpen = !state.booksOpen; render(); }
  else if (act === "parse") {
    if (state.aiBusy) return;
    state.lastFileName = "";
    state.targetLang = document.getElementById("wl").value;
    doParse(document.getElementById("wt").value);
  }
  else if (act === "ai-parse") {
    if (state.aiBusy) return;
    var wtEl = document.getElementById("wt");
    if (wtEl && wtEl.value.trim()) state.lastFileName = "";
    var live = wtEl && wtEl.value.trim() ? wtEl.value : state.lastRaw;
    runAiParse(function () { return live; });
  }
  else if (act === "export-copy" || act === "export-tsv") {
    var viewP = state.listView ? loadAll()[state.listView] : null;
    var list = state.step === "confirm" ? state.pending : (viewP ? viewP.vocab : null);
    if (!list || !list.length) return;
    if (act === "export-tsv") {
      var expName = (viewP && viewP.config.name) || "fabulita";
      downloadTsv(expName + "-vocab.tsv", list);
      return;
    }
    (navigator.clipboard ? navigator.clipboard.writeText(vocabLines(list)) : Promise.reject()).then(function () {
      state.expMsg = t("exportCopied"); state.expText = null; render();
    }, function () {
      state.expMsg = null; state.expText = vocabLines(list); render();
    });
  }
  else if (act === "drop") { state.pending.splice(+el.dataset.i, 1); render(); }
  else if (act === "cancel") { state.step = null; state.pending = null; state.skipped = 0; state.expMsg = null; state.expText = null; state.lastFileName = ""; state.upNameBuf = null; state.uploadTarget = "__new"; render(); }
  else if (act === "confirm") {
    var utEl = document.getElementById("up-target");
    var target = (utEl && utEl.value) || state.uploadTarget || "__new";
    var allL = loadAll(), tp = allL[target];
    if (target === "__new" || !tp) {
      var upEl = document.getElementById("upname");
      var glossLang = state.lang === "es" ? "en" : state.lang;
      var newName = ((upEl && upEl.value) || "").trim() || fmt(t("uploadNameDefault"), { d: new Date().toLocaleDateString() });
      var names = {};
      Object.keys(loadAll()).forEach(function (k) { names[loadAll()[k].config.name] = true; });
      var finalName = newName, seq = 2;
      while (names[finalName]) { finalName = newName + " " + seq; seq++; }
      var id = "p" + Math.random().toString(36).slice(2, 9);
      saveProj({ id: id, config: { name: finalName, lang: state.targetLang, gloss_lang: glossLang, ui_default: state.lang }, vocab: state.pending, glossary: {}, stories: [] });
      state.listView = id;
    } else {
      var known = {};
      tp.vocab.forEach(function (v) { known[norm(v.w)] = v; });
      state.pending.forEach(function (e) {
        var k = norm(e.w);
        if (known[k]) known[k].gloss = e.gloss; else { tp.vocab.push(e); known[k] = e; }
      });
      saveProj(tp);
      state.listView = tp.id;
    }
    state.step = null; state.pending = null; state.inputBuf = ""; state.expMsg = null; state.expText = null; state.lastFileName = ""; state.upNameBuf = null; state.uploadTarget = "__new";
    render();
  }
  else if (act === "tab-lists") { state.tab = "lists"; state.expMsg = null; state.expText = null; render(); }
  else if (act === "tab-gen") { state.tab = "gen"; state.expMsg = null; state.expText = null; render(); }
  else if (act === "upload-words") { if (state.aiBusy) return; state.uploadTarget = "__new"; state.step = "input"; render(); }
  else if (act === "new-list") { state.newListOpen = !state.newListOpen; render(); }
  else if (act === "new-list-save") {
    var nlNameEl = document.getElementById("nl-name");
    var nlName = ((nlNameEl && nlNameEl.value) || "").trim();
    if (!nlName) return;
    var nlLangEl = document.getElementById("wl");
    var nlLang = (nlLangEl && nlLangEl.value) || state.targetLang;
    var glossLang2 = state.lang === "es" ? "en" : state.lang;
    var names2 = {};
    Object.keys(loadAll()).forEach(function (k) { names2[loadAll()[k].config.name] = true; });
    var finalName2 = nlName, seq2 = 2;
    while (names2[finalName2]) { finalName2 = nlName + " " + seq2; seq2++; }
    var nid = "p" + Math.random().toString(36).slice(2, 9);
    saveProj({ id: nid, config: { name: finalName2, lang: nlLang, gloss_lang: glossLang2, ui_default: state.lang }, vocab: [], glossary: {}, stories: [] });
    state.newListOpen = false; state.targetLang = nlLang; state.listView = nid;
    render();
  }
  else if (act === "open-list") { state.listView = el.dataset.id; state.expMsg = null; state.expText = null; render(); }
  else if (act === "back-to-lists") { state.listView = null; state.expMsg = null; state.expText = null; render(); }
  else if (act === "add-to-list") {
    if (state.aiBusy) return;
    var tgtId = el.dataset.id, tgtList = loadAll()[tgtId];
    state.uploadTarget = tgtId;
    if (tgtList) state.targetLang = tgtList.config.lang;
    state.step = "input";
    state.expMsg = null; state.expText = null;
    render();
  }
  else if (act === "gsel") {
    var lid = el.dataset.id, allSel = loadAll(), clicked = allSel[lid];
    if (!clicked) return;
    var curLists = genLists();
    var curLang = curLists.length ? curLists[0].config.lang : null;
    if (curLang && clicked.config.lang !== curLang) {
      state.genSel = [lid];
    } else {
      var selIdx = state.genSel.indexOf(lid);
      if (selIdx !== -1) state.genSel.splice(selIdx, 1);
      else state.genSel.push(lid);
    }
    state.genSrc.words = [];
    lp.error = null;
    lp.runId = (lp.runId || 0) + 1;
    lp.phase = "idle"; lp.story = null; lp.warnings = []; lp.missing = []; lp.error = null; lp.targetId = null;
    clearDraft();
    render();
  }
  else if (act === "gen") {
    if (!requireGenLists()) return;
    if (!genBatch().length) {
      // Only the manual picker can be "empty by user inaction" — all/llm sources being
      // empty means the selection is already fully covered (selDone is shown passively).
      if (state.genSrc && state.genSrc.type === "manual") { lp.error = t("pickNone"); render(); }
      return;
    }
    lp.attempt = 0; startGenerate();
  }
  else if (act === "pick-word") {
    var gs = state.genSrc;
    if (!gs || gs.type !== "manual") return;
    var kw = el.dataset.w, ki = gs.words.indexOf(kw);
    if (ki !== -1) gs.words.splice(ki, 1);
    else if (gs.words.length < 20) gs.words.push(kw);
    state.loop.error = null;
    render();
  }
  else if (act === "reroll") { clearDraft(); lp.attempt += 1; lp.story = null; if (genReady()) startGenerate(); else { lp.phase = "idle"; state.msg = null; render(); } }
  else if (act === "copy") {
    if (!requireGenLists()) return;
    state.manualOpen = true;
    var cLists = genLists();
    var prompt = promptFor(cLists[0], genBatch(), lp.attempt, state.genSrc.type === "llm");
    (navigator.clipboard ? navigator.clipboard.writeText(prompt) : Promise.reject()).then(function () {
      state.msg = { cls: "ok", html: esc(t("copied")) }; render();
    }, function () {
      state.msg = { cls: "ok", html: "<textarea readonly style='min-height:10rem'>" + esc(prompt) + "</textarea>" }; render();
    });
  }
  else if (act === "preview-paste") {
    var raw = document.getElementById("paste-json").value.trim().replace(/^```(json)?|```$/g, "");
    if (!raw) return;
    var pLists = genLists();
    if (!pLists.length) return;
    try {
      var parsed = JSON.parse(raw);
      lp.story = normalizeStory(parsed, pLists[0]);
      var v = validateStory(pLists[0], lp.story);
      lp.warnings = v.warnings; lp.missing = v.missing;
      lp.phase = "preview"; lp.error = null;
      state.pasteBuf = ""; state.manualOpen = false;
      saveDraft();
      render();
    } catch (err) {
      lp.error = t("errParse") + err.message;
      state.manualOpen = true;
      render();
    }
  }
  else if (act === "keep") {
    var kAll = loadAll();
    var kp = (lp.targetId && kAll[lp.targetId]) || genLists()[0];
    if (!kp) return;
    if (lp.missing && lp.missing.length) {
      lp.story.vocab_used = lp.story.vocab_used.filter(function (w) { return lp.missing.indexOf(w) === -1; });
    }
    kp.stories.push(lp.story);
    saveProj(kp);
    clearDraft();
    lp.story = null; lp.warnings = []; lp.attempt = 0; lp.phase = "idle"; state.msg = null;
    lp.targetId = null;
    if (state.genSrc && state.genSrc.type === "manual") state.genSrc = { type: "all", words: [] };
    render();
  }
  else if (act === "stop") { lp.phase = "idle"; lp.story = null; clearDraft(); render(); }
  else if (act === "gen-save") {
    var d = state.genDraft || { provider: "ollama" };
    var mEl = document.getElementById("g-model"), bEl = document.getElementById("g-base"), kEl = document.getElementById("g-key");
    var cfg = {
      provider: d.provider,
      model: ((mEl && mEl.value) || PROV[d.provider].model || "").trim(),
      base: (d.provider === "custom" || d.provider === "qwen") ? (((bEl && bEl.value) || PROV[d.provider].base || "")).trim() : PROV[d.provider].base,
      key: ((kEl && kEl.value) || "").trim()
    };
    try { localStorage.setItem(LSG, JSON.stringify(cfg)); localStorage.removeItem("fabulita.apiKey"); } catch (err) {}
    state.genDraft = null; state.keyOpen = false; state.msg = null; if (lp) lp.error = null; state.aiErr = null;
    render();
  }
  else if (act === "gen-clear") {
    try { localStorage.removeItem(LSG); localStorage.removeItem("fabulita.apiKey"); } catch (err) {}
    state.genDraft = null; state.keyOpen = false; render();
  }
});

document.addEventListener("input", function (e) {
  if (e.target.id === "wt") state.inputBuf = e.target.value;
  else if (e.target.id === "paste-json") state.pasteBuf = e.target.value;
  else if (e.target.id === "upname") state.upNameBuf = e.target.value;
  else if (state.genDraft && e.target.id === "g-model") state.genDraft.model = e.target.value;
  else if (state.genDraft && e.target.id === "g-base") state.genDraft.base = e.target.value;
  else if (state.genDraft && e.target.id === "g-key") state.genDraft.key = e.target.value;
});

document.addEventListener("change", function (e) {
  if (e.target.id === "up-target") {
    state.uploadTarget = e.target.value;
    render();
    return;
  }
  if (e.target.id === "gen-src") {
    var sv = e.target.value;
    if (sv === "manual") state.genSrc = { type: "manual", words: state.genSrc && state.genSrc.type === "manual" ? state.genSrc.words : [] };
    else state.genSrc = { type: sv, words: [] };
    state.loop.error = null;
    render();
    return;
  }
  if (e.target.id === "g-prov") {
    var v = e.target.value;
    state.genDraft = { provider: v, key: "", model: PROV[v].model, base: PROV[v].base };
    state.keyOpen = true;
    render();
    return;
  }
  if (e.target.id === "wf") {
    if (state.aiBusy) return;
    var f = e.target.files[0];
    if (!f) return;
    state.targetLang = document.getElementById("wl").value;
    state.lastFileName = f.name.replace(/\.[a-z0-9]+$/i, "");
    if (/\.pdf$/i.test(f.name) || f.type === "application/pdf") { runAiParse(function () { return extractPdfText(f); }); return; }
    f.text().then(doParse);
  }
});
window.addEventListener("scroll", hidePop, { passive: true });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") hidePop(); });

(function () {
  try {
    var d = JSON.parse(localStorage.getItem(LSD));
    if (!d || !d.story || !d.targetId) return;
    if (!loadAll()[d.targetId]) { localStorage.removeItem(LSD); return; }
    state.open = true;
    state.tab = "gen";
    state.genSel = d.genSel || [d.targetId];
    state.genSrc = d.genSrc || { type: "all", words: [] };
    state.loop.story = d.story;
    state.loop.warnings = d.warnings || [];
    state.loop.missing = d.missing || [];
    state.loop.targetId = d.targetId;
    state.loop.phase = "preview";
  } catch (e) {}
})();

render();
})();
</script>
</body>
</html>
