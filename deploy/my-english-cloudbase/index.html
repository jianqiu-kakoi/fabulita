<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="My English 场景英语学习：未登录可本地学习，登录后同步进度。"
    />
    <meta name="theme-color" content="#f7f3ec" />
    <link rel="icon" href="data:," />
    <title>My English · 场景英语学习</title>
  </head>
  <body>
    <div id="cloud-app" class="cloud-app">
      <header class="account-bar">
        <a class="account-brand" href="/" aria-label="My English 首页">
          <span class="account-brand-mark" aria-hidden="true">ME</span>
          <span>
            <strong>My English</strong>
            <small>场景英语学习</small>
          </span>
        </a>

        <div class="account-actions">
          <span class="sync-state is-local" id="sync-state" role="status" aria-live="polite">
            <i aria-hidden="true"></i>
            <span>本机保存</span>
          </span>
          <button class="account-button primary" id="login-button" type="button">
            登录并同步
          </button>
          <button class="account-button" id="account-button" type="button" hidden>
            <span id="account-label">我的账号</span>
          </button>
        </div>
      </header>

      <aside class="setup-banner" id="setup-banner" hidden>
        云端环境尚未连接，当前仍可正常学习，进度只保存在这台设备。
      </aside>

      <main class="learner-shell">
        <iframe
          id="learner-frame"
          class="learner-frame"
          src="/my-english.html?storageProfile=guest"
          title="My English 英语学习"
        ></iframe>
      </main>
    </div>

    <dialog class="account-dialog" id="account-dialog" aria-labelledby="dialog-title">
      <form method="dialog" class="account-dialog-card" id="phone-login-form">
        <button class="dialog-close" type="button" value="cancel" aria-label="关闭登录窗口">×</button>

        <div id="login-panel">
          <p class="dialog-kicker">跨设备学习</p>
          <h1 id="dialog-title">手机号登录</h1>
          <p class="dialog-copy">
            首次验证会自动创建账号。未登录时，学习记录仍只保存在当前浏览器。
          </p>

          <label class="field">
            <span>中国大陆手机号</span>
            <span class="phone-field">
              <b>+86</b>
              <input
                id="phone-input"
                name="phone"
                type="tel"
                inputmode="numeric"
                autocomplete="tel-national"
                maxlength="11"
                placeholder="138 0000 0000"
                required
              />
            </span>
          </label>

          <div class="verification-row" id="verification-row" hidden>
            <label class="field">
              <span>6 位验证码</span>
              <input
                id="code-input"
                name="code"
                type="text"
                inputmode="numeric"
                autocomplete="one-time-code"
                maxlength="6"
                pattern="[0-9]{6}"
                placeholder="请输入短信验证码"
              />
            </label>
          </div>

          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>

          <label class="consent-row">
            <input id="privacy-consent" type="checkbox" required />
            <span>
              我已阅读并同意
              <a href="/privacy.html" target="_blank" rel="noopener">《隐私说明》</a>，
              了解登录后学习进度及需智能复核的作答会上传。
            </span>
          </label>

          <button class="dialog-submit" id="send-code-button" type="submit">
            获取验证码
          </button>
          <button class="dialog-submit" id="verify-code-button" type="button" hidden>
            登录并同步进度
          </button>

          <p class="privacy-note">
            登录后，学习进度和需要智能复核的作答会发送到你的 CloudBase 环境。
            网页不保存密码或服务端密钥。
          </p>
        </div>

        <div id="profile-panel" hidden>
          <p class="dialog-kicker">云端账号</p>
          <h1>进度已同步</h1>
          <p class="dialog-copy" id="profile-copy"></p>
          <button class="dialog-submit secondary" id="sync-now-button" type="button">
            立即同步
          </button>
          <button class="dialog-submit danger" id="logout-button" type="button">
            退出登录
          </button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
